<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Dance It Out - Architectural Sheet</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face{font-family:"TechB";src:url("fonts/Barlow_Condensed_800.ttf")}
  @font-face{font-family:"TechM";src:url("fonts/Barlow_Condensed_600.ttf")}
  @font-face{font-family:"Arch";src:url("fonts/Architects_Daughter.ttf")}
  /* Venezuelan flag palette (yellow / blue / red) on navy drafting ink */
  :root{--ink:#16213e;--yellow:#ffcc00;--blue:#1d4fb8;--red:#cf142b;--grid:#dce7f6;}
  html,body{margin:0;background:#fff}
  #art{width:1500px;height:1800px;position:relative;overflow:hidden;color:var(--ink);background:#fff;font-family:"Arch",cursive}
  .bg{position:absolute;inset:0;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
                     linear-gradient(#c3d3ec 1px,transparent 1px),linear-gradient(90deg,#c3d3ec 1px,transparent 1px);
    background-size:30px 30px,30px 30px,150px 150px,150px 150px}
  .sheet{position:absolute;inset:0;width:1500px;height:1800px}
  .head{position:absolute;left:0;right:0;top:70px;text-align:center}
  h1{margin:0;font:400 158px/0.9 "TechB",sans-serif;letter-spacing:5px;display:inline-block}
  h1 .r{color:var(--red)} h1 .b{color:var(--blue)}
  .strip{width:850px;margin:6px auto 0;height:36px;display:flex;flex-direction:column}
  .strip i{display:block;flex:1}
  .dim{width:850px;margin:14px auto 0;position:relative;height:40px}
  .dim .ln{position:absolute;left:0;right:0;top:20px;border-top:2px solid var(--blue)}
  .dim .tk{position:absolute;top:8px;width:0;height:24px;border-left:2px solid var(--blue)}
  .dim .tx{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;padding:0 22px;font:400 34px/40px "TechM",sans-serif;letter-spacing:6px;color:var(--ink);white-space:nowrap}
  .deco{position:absolute;top:96px}
  .grid{position:absolute;left:70px;top:408px;width:1360px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
  .card{position:relative;height:470px;border:3px solid var(--ink);background:rgba(255,255,255,.0)}
  .card:after{content:"";position:absolute;inset:6px;border:1px solid var(--ink);opacity:.45;pointer-events:none}
  .card svg.fig{position:absolute;left:0;top:10px;width:100%;height:345px}
  .bub{position:absolute;left:10px;top:8px;width:44px;height:44px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;z-index:3;text-align:center;line-height:1}
  .bub b{display:block;font:400 22px/23px "TechB",sans-serif;margin-top:1px}
  .bub s{display:block;text-decoration:none;border-top:2px solid var(--ink);font:400 10px/15px "Arch",cursive;margin:0 -1px}
  .elev{position:absolute;right:14px;top:12px;font:400 19px "Arch",cursive;letter-spacing:1px;z-index:3;background:#fff;padding:0 4px}
  .name{position:absolute;left:0;right:0;bottom:72px;text-align:center;font:400 30px/36px "TechB",sans-serif;letter-spacing:1.5px;white-space:nowrap}
  .name em{font-style:normal;color:var(--red)}
  .cnt{position:absolute;left:14px;right:14px;bottom:14px;text-align:center;font:400 22px/24px "Arch",cursive;height:52px;display:flex;align-items:center;justify-content:center;border-top:1.5px solid var(--ink)}
  .scale{position:absolute;left:0;right:0;top:1398px}
  .tblock{position:absolute;left:70px;right:70px;top:1468px;height:276px;border:3px solid var(--ink);display:grid;
    grid-template-columns:250px 1fr 1fr 210px 190px;grid-template-rows:86px 86px 1fr}
  .tblock>div{border:1.5px solid var(--ink);padding:6px 12px;position:relative;background:rgba(255,255,255,.0)}
  .tblock small{position:absolute;left:8px;top:3px;font:400 15px "Arch",cursive;letter-spacing:2px;color:#4a5878}
  .tblock .v{position:absolute;left:12px;bottom:6px;font:400 44px/1 "TechB",sans-serif;letter-spacing:2px;white-space:nowrap}
  .tblock .v.m{font-family:"TechM",sans-serif;font-size:38px}
  .tag{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:26px;font:400 86px/1 "TechB",sans-serif;letter-spacing:8px}
  .tag span{color:var(--red)} .tag b{color:var(--blue);font-weight:400} .tag u{color:#c99200;text-decoration:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="denim" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2.6" stroke="#5b86bd" stroke-width=".55"/></pattern>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#16213e" stroke-width="1.6"/></pattern>
    <pattern id="ground" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16213e" stroke-width=".9"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1d4fb8"/></marker>
  </defs>
</svg>
<div id="art">
  <div class="bg"></div>

  <!-- drawing sheet frame with zone references -->
  <svg class="sheet" viewBox="0 0 1500 1800">
    <rect x="14" y="14" width="1472" height="1772" fill="none" stroke="#16213e" stroke-width="2"/>
    <rect x="42" y="42" width="1416" height="1716" fill="none" stroke="#16213e" stroke-width="5"/>
    <g font-family="TechM" font-size="20" fill="#16213e" text-anchor="middle">
      <text x="375" y="34">A</text><text x="750" y="34">B</text><text x="1125" y="34">C</text>
      <text x="375" y="1782">A</text><text x="750" y="1782">B</text><text x="1125" y="1782">C</text>
      <text x="28" y="620">1</text><text x="28" y="1180">2</text><text x="1472" y="620">1</text><text x="1472" y="1180">2</text>
    </g>
    <g stroke="#16213e" stroke-width="2"><path d="M562 14v28M938 14v28M1312 14v28M188 14v28M562 1758v28M938 1758v28M1312 1758v28M188 1758v28M14 900h28M1458 900h28M14 330h28M1458 330h28"/></g>
  </svg>

  <!-- header -->
  <div class="head">
    <h1><span class="r">DANCE</span> IT <span class="b">OUT</span></h1>
    <div class="strip"><i style="background:#ffcc00"></i><i style="background:#1d4fb8"></i><i style="background:#cf142b"></i></div>
    <div class="dim"><div class="ln"></div><div class="tk" style="left:0"></div><div class="tk" style="right:0"></div>
      <div class="tx">8 STEPS &middot; ONE BEAT &middot; SABOR VENEZOLANO</div></div>
  </div>
  <svg class="deco" style="left:80px" width="210" height="190" viewBox="0 0 210 190" id="flagdeco"></svg>
  <svg class="deco" style="right:80px" width="210" height="190" viewBox="0 0 210 190" id="tepuidec"></svg>

  <div class="grid" id="grid"></div>
  <svg class="scale" width="1500" height="56" viewBox="0 0 1500 56" id="scale"></svg>

  <div class="tblock">
    <div style="grid-row:1/3"><svg id="flagcell" width="226" height="168" viewBox="0 0 226 168" style="position:absolute;left:10px;top:6px"></svg></div>
    <div style="grid-column:2/4"><small>PROJECT</small><span class="v">DANCE IT OUT</span></div>
    <div><small>SCALE</small><span class="v m">1 : 1 BEAT</span></div>
    <div><small>SHEET</small><span class="v m">A-01</span></div>
    <div style="grid-column:2/4"><small>DRAWING</small><span class="v m">8 CHOREOGRAPHIC ELEVATIONS</span></div>
    <div><small>THEME</small><span class="v m">VENEZUELA</span></div>
    <div><small>REV.</small><span class="v m">A</span></div>
    <div class="tag"><span>REPEAT.</span><b>SMILE.</b><u>GLOW.</u><svg id="starsrow" width="330" height="70" viewBox="0 0 330 70"></svg></div>
  </div>
</div>

<script>
// Steps follow the sequence given by the client. "Right" = the dancer's own right (the viewer's left).
const INK="#16213e", SKIN="#f4d9c2", HAIR="#231a1a", RED="#cf142b", BLUE="#1d4fb8", YEL="#ffcc00", DEN="#bcd3ef", DENL="#5b86bd";
const stand={rK:[43,108],rF:[40,134],lK:[57,108],lF:[60,134]};
const poses=[
 {n:"HANDS ON <em>HEAD</em>",cnt:"both hands rest on the head",
  rE:[24,28],rH:[40,12],lE:[76,28],lH:[60,12],...stand,T:[[40,12],[60,12]]},
 {n:"HANDS ON <em>SHOULDERS</em>",cnt:"slide both hands down to the shoulders",
  rE:[24,56],rH:[36,39],lE:[76,56],lH:[64,39],...stand,T:[[36,39],[64,39]],
  A:["M30 18 L30 33","M70 18 L70 33"]},
 {n:"HANDS ON <em>HIPS</em>",cnt:"drop both hands onto the hips",
  rE:[24,58],rH:[40,77],lE:[76,58],lH:[60,77],rK:[40,108],rF:[35,134],lK:[60,108],lF:[65,134],T:[[40,77],[60,77]],
  A:["M20 50 L20 70","M80 50 L80 70"]},
 {n:"CHEST <em>TAP</em>",cnt:"pat the chest with both hands",
  rE:[31,58],rH:[45,49],lE:[69,58],lH:[55,49],...stand,T:[[45,49],[55,49]],
  A:["M40 34 L44 43","M60 34 L56 43"]},
 {n:"RIGHT ARM <em>OUT</em>",cnt:"right arm extends, left hand touches the forearm",
  rE:[17,40],rH:[-5,41],lE:[41,59],lH:[18,42],...stand,T:[[18,42]],
  A:["M56 70 Q40 74 24 50"]},
 {n:"TO THE <em>SHOULDER</em>",cnt:"left hand slides up to the right shoulder",
  rE:[17,40],rH:[-5,41],lE:[52,58],lH:[38,37],...stand,T:[[38,37]],
  A:["M12 31 L34 31"]},
 {n:"HEART <em>TAP</em>",cnt:"left hand reaches out, then taps the heart",
  rE:[17,40],rH:[-5,41],lE:[67,60],lH:[56,48],...stand,T:[[56,48]],G:[88,40],
  A:["M85 36 Q86 24 70 28 Q60 31 58 44"]},
 {n:"<em>CLAP</em>",cnt:"both hands clap at the center",
  rE:[34,58],rH:[49,46],lE:[66,58],lH:[51,46],rK:[44,108],rF:[42,134],lK:[56,108],lF:[58,134],T:[[50,46]],
  B:[[50,46]]}
];
const L=(a,b,w,c,extra="")=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
// outlined, tapered limb: ink outline underneath, fill (and optional hatch) on top
function tube(pts,ws,fill,hatch){
  let o="",f="",h="";
  for(let i=0;i<pts.length-1;i++){
    o+=L(pts[i],pts[i+1],ws[i]+3.2,INK);
    f+=L(pts[i],pts[i+1],ws[i],fill);
    if(hatch)h+=L(pts[i],pts[i+1],ws[i]-1.2,"url(#denim)");
  }
  return o+f+h;
}
function fingers(e,h){
  const dx=h[0]-e[0],dy=h[1]-e[1],m=Math.hypot(dx,dy)||1,ux=dx/m,uy=dy/m;
  let s="";
  [[-38,.82],[-14,1],[10,1.05],[34,.9],[-78,.6]].forEach(([a,len])=>{
    const r=a*Math.PI/180,c=Math.cos(r),sn=Math.sin(r),vx=ux*c-uy*sn,vy=ux*sn+uy*c;
    const p0=[h[0]+vx*2,h[1]+vy*2],p1=[h[0]+vx*(2+6.4*len),h[1]+vy*(2+6.4*len)];
    s+=L(p0,p1,3.6,INK)+L(p0,p1,1.7,SKIN);
  });
  return s;
}
function figure(p){
  const rS=[41,39],lS=[59,39],hipR=[45,77],hipL=[55,77];
  const hairBack=`<path d="M37 14Q35 -3 50 2Q66 -3 63 14Q68 30 65 47Q58 50 57 41L43 41Q42 50 35 47Q32 30 37 14Z" fill="${HAIR}" stroke="${INK}" stroke-width="1.6"/>
    <path d="M38 20Q37 33 39 45M40.5 20Q39.5 33 41 44M62 20Q63 33 61 45M59.5 20Q60.5 33 59 44" stroke="#6b4a3a" stroke-width=".8" fill="none" stroke-linecap="round"/>`;
  const legs=tube([hipR,p.rK,p.rF],[15,12.6],DEN,true)+tube([hipL,p.lK,p.lF],[15,12.6],DEN,true);
  const creases=[[p.rK,-1],[p.lK,1]].map(([k,s])=>`<path d="M${k[0]-4} ${k[1]-3}q4 2 8 0M${k[0]-3.5} ${k[1]+1}q3.5 1.6 7 0" stroke="${DENL}" stroke-width=".8" fill="none" stroke-linecap="round"/>`).join("");
  const cuffs=[p.rF,p.lF].map(f=>`<path d="M${f[0]-6} ${f[1]-6}h12" stroke="${INK}" stroke-width="1.2"/>`).join("");
  const seams=L(hipR,p.rK,.7,DENL)+L(hipL,p.lK,.7,DENL);
  const waist=`<path d="M42.5 67H57.5L59 80H41Z" fill="${DEN}" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M42 71.4H58" stroke="${INK}" stroke-width="1"/><rect x="48" y="69.8" width="4" height="3.2" fill="${YEL}" stroke="${INK}" stroke-width=".8"/>
    <path d="M50 73V80M45.5 72V76M54.5 72V76" stroke="${DENL}" stroke-width=".8"/>`;
  const shoes=[[p.rF,-3],[p.lF,3]].map(([f,dx])=>`<path d="M${f[0]-7+dx} ${f[1]-2}Q${f[0]+dx} ${f[1]-6} ${f[0]+7+dx} ${f[1]-2}Q${f[0]+10+dx} ${f[1]+3} ${f[0]+9+dx} ${f[1]+6}H${f[0]-9+dx}Q${f[0]-10+dx} ${f[1]+2} ${f[0]-7+dx} ${f[1]-2}Z" fill="${RED}" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M${f[0]-9.4+dx} ${f[1]+4.2}H${f[0]+9.4+dx}" stroke="#fff" stroke-width="2.2"/><path d="M${f[0]-9.4+dx} ${f[1]+6}H${f[0]+9.4+dx}" stroke="${INK}" stroke-width="1"/>
    <path d="M${f[0]-3+dx} ${f[1]-4}l3 2M${f[0]+dx} ${f[1]-4.6}l3 2" stroke="#fff" stroke-width="1" stroke-linecap="round"/>`).join("");
  const mid=`<path d="M43 56Q50 60 57 56L57.5 68H42.5Z" fill="${SKIN}" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="50" cy="63" r=".8" fill="${INK}"/>`;
  const top=`<path d="M40.5 38Q50 44 59.5 38L58 57Q50 61 42 57Z" fill="${YEL}" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M44 41.5Q50 46 56 41.5M43 57Q50 54 57 57" stroke="${INK}" stroke-width=".9" fill="none"/>
    <circle cx="50" cy="49.5" r="2.4" fill="none" stroke="${INK}" stroke-width="1.1"/><path d="M45 41L43.4 32.5M55 41L56.6 32.5" stroke="${INK}" stroke-width="1.3" stroke-linecap="round"/>`;
  const arms=tube([rS,p.rE,p.rH],[6.8,5.8],SKIN)+tube([lS,p.lE,p.lH],[6.8,5.8],SKIN);
  const wrist=[[p.rE,p.rH],[p.lE,p.lH]].map(([e,h])=>{const dx=h[0]-e[0],dy=h[1]-e[1],m=Math.hypot(dx,dy)||1,ux=dx/m,uy=dy/m;const c=[h[0]-ux*3.4,h[1]-uy*3.4];return `<circle cx="${c[0]}" cy="${c[1]}" r="3.3" fill="none" stroke="${BLUE}" stroke-width="1.3"/>`}).join("");
  const hands=fingers(p.rE,p.rH)+fingers(p.lE,p.lH)+[p.rH,p.lH].map(h=>`<circle cx="${h[0]}" cy="${h[1]}" r="3.7" fill="${SKIN}" stroke="${INK}" stroke-width="1.6"/>`).join("");
  const neck=`<path d="M46 27H54L54.5 38Q50 41 45.5 38Z" fill="${SKIN}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
  const head=`<ellipse cx="50" cy="17" rx="10.5" ry="12.5" fill="${SKIN}" stroke="${INK}" stroke-width="1.9"/>
    <path d="M39 15Q40 2 52 3.5Q62 4 61 15Q57 8 49 9Q42 10 39 15Z" fill="${HAIR}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M44 7Q47 5 51 5M47 8.5Q51 6 55 6.4" stroke="#6b4a3a" stroke-width=".7" fill="none" stroke-linecap="round"/>
    <path d="M43.6 13.6Q46 12.4 48.4 13.4M51.6 13.4Q54 12.4 56.4 13.6" stroke="${INK}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M44.5 16.4Q46.5 14.2 48.5 16.4M51.5 16.4Q53.5 14.2 55.5 16.4" stroke="${INK}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M45 15.7l-1.4-.8M48 15l.3-1M52 15l-.3-1M55 15.7l1.4-.8" stroke="${INK}" stroke-width=".7" stroke-linecap="round"/>
    <path d="M50 17.4l-1.2 3.2h2.4" stroke="${INK}" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 22.4Q50 28.4 55 22.4Q50 24 45 22.4Z" fill="${RED}" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="42.3" cy="21.3" r="2.3" fill="${RED}" opacity=".25"/><circle cx="57.7" cy="21.3" r="2.3" fill="${RED}" opacity=".25"/>
    <circle cx="39.6" cy="19.2" r="1.4" fill="${YEL}" stroke="${INK}" stroke-width=".9"/><circle cx="60.4" cy="19.2" r="1.4" fill="${YEL}" stroke="${INK}" stroke-width=".9"/>`;
  return hairBack+legs+creases+seams+cuffs+waist+shoes+mid+top+arms+wrist+hands+neck+head;
}
// drafting furniture: level lines, centre axis, floor with ground hatch, height dimension
function drafting(){
  const lv=[[4.5,"HEAD"],[39,"SHLDR"],[67,"WAIST"],[108,"KNEE"],[140.5,"FLOOR"]];
  let s=`<line x1="50" y1="-12" x2="50" y2="146" stroke="${RED}" stroke-width=".5" stroke-dasharray="8 2 1.5 2" opacity=".7"/>`;
  lv.forEach(([y,t])=>{
    s+=`<line x1="-12" y1="${y}" x2="118" y2="${y}" stroke="${BLUE}" stroke-width=".45" stroke-dasharray="3 2" opacity=".6"/>
        <text x="-28" y="${y-1.2}" text-anchor="start" font-family="Arch" font-size="5.2" fill="${BLUE}">${t}</text>`;
  });
  s+=`<line x1="-14" y1="140.5" x2="118" y2="140.5" stroke="${INK}" stroke-width="1.4"/>
      <rect x="-14" y="140.5" width="132" height="5" fill="url(#ground)"/>`;
  s+=`<line x1="124" y1="4.5" x2="124" y2="140.5" stroke="${BLUE}" stroke-width=".6"/>
      <g stroke="${BLUE}" stroke-width=".7"><line x1="121.5" y1="7" x2="126.5" y2="2"/><line x1="121.5" y1="143" x2="126.5" y2="138"/>
      ${[39,67,108].map(y=>`<line x1="122.4" y1="${y+1.6}" x2="125.6" y2="${y-1.6}"/>`).join("")}</g>
      <text transform="translate(120.5 76) rotate(-90)" text-anchor="middle" font-family="Arch" font-size="5" fill="${BLUE}">OVERALL HEIGHT</text>`;
  return s;
}
const target=([x,y])=>`<g stroke="${RED}" stroke-width=".9" fill="none"><circle cx="${x}" cy="${y}" r="3.8"/><line x1="${x-6.5}" y1="${y}" x2="${x+6.5}" y2="${y}"/><line x1="${x}" y1="${y-6.5}" x2="${x}" y2="${y+6.5}"/></g>`;
const grid=document.getElementById("grid");
poses.forEach((p,i)=>{
  const k=String(i+1).padStart(2,"0");
  const arrows=(p.A||[]).map(d=>`<path d="${d}" fill="none" stroke="${BLUE}" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>`).join("");
  const ghost=p.G?`<circle cx="${p.G[0]}" cy="${p.G[1]}" r="4.4" fill="none" stroke="${BLUE}" stroke-width="1" stroke-dasharray="2 1.6"/>`:"";
  const burst=(p.B||[]).map(([x,y])=>`<path d="M${x} ${y-7}v-6M${x-7} ${y-4}l-5-4M${x+7} ${y-4}l5-4" stroke="${BLUE}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`).join("");
  grid.insertAdjacentHTML("beforeend",
   `<div class="card"><div class="bub"><b>${i+1}</b><s>A-${k}</s></div><div class="elev">ELEV. ${k}</div>
    <svg class="fig" viewBox="-30 -16 160 164">${drafting()}${figure(p)}${ghost}${arrows}${burst}${p.T.map(target).join("")}</svg>
    <div class="name">${p.n}</div><div class="cnt">${p.cnt}</div></div>`);
});

// ---- Venezuelan elements ----
const starPath="M0 -7l2 5 5 2-5 2-2 5-2-5-5-2 5-2z";
function flagSVG(w,h,x,y){ // flat flag elevation, 3:2
  const sh=h/3; let st="";
  for(let i=0;i<8;i++){const t=(i-3.5)/3.5,sx=x+w/2+t*w*.27,sy=y+sh+sh*.58-Math.cos(t*1.15)*sh*.2+sh*.14;
    st+=`<path transform="translate(${sx} ${sy}) scale(${w/150})" d="${starPath}" fill="#fff" stroke="${INK}" stroke-width="1"/>`;}
  return `<rect x="${x}" y="${y}" width="${w}" height="${sh}" fill="${YEL}" stroke="${INK}" stroke-width="2.2"/>
    <rect x="${x}" y="${y+sh}" width="${w}" height="${sh}" fill="${BLUE}" stroke="${INK}" stroke-width="2.2"/>
    <rect x="${x}" y="${y+2*sh}" width="${w}" height="${sh}" fill="${RED}" stroke="${INK}" stroke-width="2.2"/>${st}`;
}
document.getElementById("flagdeco").innerHTML=
  `<line x1="14" y1="6" x2="14" y2="178" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="14" cy="6" r="6" fill="${YEL}" stroke="${INK}" stroke-width="2.2"/>`+
  flagSVG(168,112,22,14)+
