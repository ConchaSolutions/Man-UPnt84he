<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Dance It Out - Manga Page</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face{font-family:"Bang";src:url("fonts/Bangers.ttf")}
  @font-face{font-family:"Hand";src:url("fonts/Patrick_Hand.ttf")}
  /* Venezuelan flag palette (yellow / blue / red) on manga black ink */
  :root{--ink:#14122b;--yellow:#ffcc00;--blue:#1d4fb8;--red:#cf142b;}
  html,body{margin:0;background:#fff}
  #art{width:1500px;height:1800px;position:relative;overflow:hidden;color:var(--ink);background:#fff;font-family:"Hand",cursive}
  .frame{position:absolute;left:26px;top:26px;width:1448px;height:1748px;border:5px solid var(--ink);box-sizing:border-box}
  .hbg{position:absolute;left:0;top:30px;width:1500px;height:370px}
  .title{position:absolute;left:0;right:0;top:48px;text-align:center}
  h1{margin:0;display:inline-block;font:400 188px/1 "Bang",cursive;letter-spacing:4px;transform:skewX(-8deg) rotate(-2deg);
     background:linear-gradient(180deg,#ffcc00 0 34%,#1d4fb8 34% 67%,#cf142b 67% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     -webkit-text-stroke:11px var(--ink);paint-order:stroke fill;filter:drop-shadow(9px 9px 0 var(--ink))}
  .sub{position:absolute;left:50%;top:272px;transform:translateX(-50%) rotate(-1.5deg) skewX(-8deg);background:var(--ink);color:#fff;
       font:400 50px/1 "Bang",cursive;letter-spacing:5px;padding:10px 34px 12px;white-space:nowrap;border:4px solid var(--ink);box-shadow:7px 7px 0 var(--yellow)}
  .sub b{color:var(--yellow);font-weight:400;margin:0 12px}
  .deco{position:absolute;top:70px}
  .grid{position:absolute;left:70px;top:420px;width:1360px;display:grid;grid-template-columns:repeat(4,1fr);gap:30px 26px}
  .card{position:relative;height:466px;border:5px solid var(--ink);box-sizing:border-box;background:transparent}
  .card svg.fx{position:absolute;inset:0;width:100%;height:100%}
  .card svg.fig{position:absolute;left:0;top:6px;width:100%;height:345px;overflow:visible}
  .stepbox{position:absolute;left:-5px;top:-5px;background:var(--ink);color:#fff;font:400 34px/1 "Bang",cursive;letter-spacing:2px;padding:5px 14px 7px;z-index:4}
  .stepbox span{color:var(--yellow);font-size:42px;margin-left:4px}
  .sfx{position:absolute;right:-6px;top:8px;font:400 54px/1 "Bang",cursive;letter-spacing:2px;color:var(--yellow);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;
       transform:rotate(var(--sr)) skewX(-8deg);z-index:5;white-space:nowrap;filter:drop-shadow(4px 4px 0 var(--red))}
  .cap{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border:4px solid var(--ink);text-align:center;padding:2px 6px 5px;z-index:4}
  .cap b{display:block;font:400 33px/1.1 "Bang",cursive;letter-spacing:1.5px;white-space:nowrap}
  .cap b em{font-style:normal;color:var(--red)}
  .cap i{display:block;font:400 21px/1.1 "Hand",cursive;font-style:normal;min-height:46px;padding-top:2px}
  .foot{position:absolute;left:70px;top:1424px;width:1360px;height:300px;border:5px solid var(--ink);box-sizing:border-box}
  .foot svg{position:absolute;inset:0;width:100%;height:100%}
  .tag{position:absolute;left:285px;top:70px;font:400 94px/1 "Bang",cursive;letter-spacing:5px;white-space:nowrap;transform:skewX(-8deg) rotate(-1.5deg);
       -webkit-text-stroke:10px var(--ink);paint-order:stroke fill;filter:drop-shadow(6px 6px 0 var(--ink))}
  .tag .r{color:var(--red)} .tag .b{color:#3b7bff} .tag .y{color:var(--yellow)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <pattern id="dotY" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4.5" cy="4.5" r="2.4" fill="#ffcc00"/></pattern>
  <pattern id="dotB" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4.5" cy="4.5" r="2.4" fill="#1d4fb8"/></pattern>
  <pattern id="dotR" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4.5" cy="4.5" r="2.4" fill="#cf142b"/></pattern>
  <pattern id="dotK" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3.5" cy="3.5" r="1.5" fill="#14122b"/></pattern>
</defs></svg>
<div id="art">
  <div class="frame"></div>
  <svg class="hbg" id="hbg" viewBox="0 0 1500 370"></svg>
  <div class="title"><h1>DANCE IT OUT</h1></div>
  <div class="sub">8 STEPS<b>&#9733;</b>1 BEAT<b>&#9733;</b>SABOR VENEZOLANO!</div>
  <svg class="deco" style="left:70px" width="230" height="230" viewBox="0 0 230 230" id="flagdeco"></svg>
  <svg class="deco" style="right:66px" width="240" height="230" viewBox="0 0 240 230" id="tepui"></svg>
  <div class="grid" id="grid"></div>
  <div class="foot"><svg id="footsvg" viewBox="0 0 1360 300"></svg>
    <div class="tag"><span class="r">REPEAT.</span> <span class="b">SMILE.</span> <span class="y">GLOW.</span></div></div>
</div>
<script>
const INK="#14122b", SKIN="#ffe9d6", HAIR="#1d1b34", HAIRHL="#8896dd", JEANS="#4c86dc", JEANSL="#a6c9fa", RED="#cf142b", BLUE="#1d4fb8", YEL="#ffcc00";
const std={rK:[44,106],rF:[41,126],lK:[56,106],lF:[59,126]};
// Sequence per the client brief. "Right" = the dancer's own right (the viewer's left).
const poses=[
 {n:"HANDS ON <em>HEAD</em>",cnt:"both hands rest on the head",sfx:"BOP!",sr:"-5deg",sway:10,
  rE:[22,42],rH:[31,21],lE:[78,42],lH:[69,21],...std,front:true,rays:[[31,21],[69,21]]},
 {n:"HANDS ON <em>SHOULDERS</em>",cnt:"slide both hands down to the shoulders",sfx:"SLIDE!",sr:"4deg",sway:-8,
  rE:[24,68],rH:[37,55],lE:[76,68],lH:[63,55],...std,ml:["M30 36L30 49","M24 38L24 52","M70 36L70 49","M76 38L76 52"],rays:[[37,55],[63,55]]},
 {n:"HANDS ON <em>HIPS</em>",cnt:"drop both hands onto the hips",sfx:"HIP!",sr:"-3deg",sway:14,
  rE:[24,69],rH:[40,83],lE:[76,69],lH:[60,83],rK:[41,106],rF:[36,126],lK:[59,106],lF:[64,126],
  ml:["M16 66L16 82","M11 64L11 80","M84 66L84 82","M89 64L89 80"],rays:[[40,83],[60,83]]},
 {n:"CHEST <em>TAP</em>",cnt:"pat the chest with both hands",sfx:"PAT PAT!",sr:"3deg",sway:-10,
  rE:[30,70],rH:[45,63],lE:[70,70],lH:[55,63],...std,rays:[[45,63],[55,63]]},
 {n:"RIGHT ARM <em>OUT</em>",cnt:"right arm extends, left hand touches the forearm",sfx:"SWOOSH!",sr:"-4deg",sway:22,
  rE:[21,55],rH:[0,55],lE:[42,73],lH:[22,57],...std,ml:["M46 80Q30 80 19 62","M50 85Q29 87 15 67"],rays:[[22,57]]},
 {n:"TO THE <em>SHOULDER</em>",cnt:"left hand slides up to the right shoulder",sfx:"ZIP!",sr:"5deg",sway:18,
  rE:[21,55],rH:[0,55],lE:[50,74],lH:[39,54],...std,ml:["M8 47L28 47","M13 42L32 42"],rays:[[39,54]]},
 {n:"HEART <em>TAP</em>",cnt:"left hand reaches out, then taps the heart",sfx:"DOKI!",sr:"-3deg",sway:16,
  rE:[21,55],rH:[0,55],lE:[68,72],lH:[56,63],...std,ghost:[88,50],dash:["M86 57Q86 74 63 69"],rays:[[56,63]],heart:[74,44]},
 {n:"<em>CLAP</em>",cnt:"both hands clap at the center",sfx:"CLAP!",sr:"4deg",sway:-6,
  rE:[34,72],rH:[49,62],lE:[66,72],lH:[51,62],rK:[45,106],rF:[43,126],lK:[55,106],lF:[57,126],rays:[[50,62]],big:true}
];
const L=(a,b,w,c,x="")=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;
function tube(pts,ws,fill,hl){
  let o="",f="",h="";
  for(let i=0;i<pts.length-1;i++){o+=L(pts[i],pts[i+1],ws[i]+3.8,INK);f+=L(pts[i],pts[i+1],ws[i],fill);}
  if(hl)for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy)||1,nx=-dy/m*ws[i]*.22,ny=dx/m*ws[i]*.22;
    h+=L([a[0]+nx+dx*.12,a[1]+ny+dy*.12],[b[0]+nx-dx*.12,b[1]+ny-dy*.12],1.5,hl);}
  return o+f+h;
}
function fingers(e,h){
  const dx=h[0]-e[0],dy=h[1]-e[1],m=Math.hypot(dx,dy)||1,ux=dx/m,uy=dy/m;let s="";
  [[-36,.9],[0,1.1],[36,.9],[-84,.6]].forEach(([a,len])=>{
    const r=a*Math.PI/180,c=Math.cos(r),sn=Math.sin(r),vx=ux*c-uy*sn,vy=ux*sn+uy*c;
    const p0=[h[0]+vx*2.4,h[1]+vy*2.4],p1=[h[0]+vx*(2.4+5.6*len),h[1]+vy*(2.4+5.6*len)];
    s+=L(p0,p1,4.8,INK)+L(p0,p1,2.7,SKIN);
  });
  return s;
}
function eye(cx,cy,flip){
  const s=flip?-1:1;
  return `<ellipse cx="${cx}" cy="${cy}" rx="6.6" ry="8.2" fill="#fff" stroke="${INK}" stroke-width="1"/>
   <ellipse cx="${cx}" cy="${cy+.4}" rx="5.2" ry="7.3" fill="#2a1712"/>
   <ellipse cx="${cx}" cy="${cy+3.2}" rx="4.4" ry="3.6" fill="#a55a2c"/>
   <ellipse cx="${cx}" cy="${cy+.2}" rx="2.4" ry="3.6" fill="#0b0707"/>
   <circle cx="${cx-1.9*s}" cy="${cy-2.8}" r="2.3" fill="#fff"/><circle cx="${cx+2.1*s}" cy="${cy+3.6}" r="1.1" fill="#fff"/>
   <path d="M${cx-7.4} ${cy-2.4}Q${cx-3.4} ${cy-10.2} ${cx+2.4} ${cy-9}Q${cx+6.6} ${cy-8} ${cx+7.6} ${cy-1.6}" stroke="${INK}" stroke-width="3.1" fill="none" stroke-linecap="round"/>
   <path d="M${cx+7.4*s} ${cy-2.6}l${3.4*s} -2.6M${cx+6.8*s} ${cy-5.4}l${3*s} -3" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>
   <path d="M${cx-5} ${cy+7.6}Q${cx} ${cy+9.6} ${cx+5} ${cy+7.6}" stroke="${INK}" stroke-width=".9" fill="none"/>`;
}
function figure(p){
  const rS=[41,55],lS=[59,55],hipR=[45,84],hipL=[55,84];
  // long hair behind the body + swinging ponytail with a tricolour scrunchie
  const hairBack=`<path d="M26 26Q23 3 50 3Q77 3 74 26Q80 45 73 64Q65 62 64 49L36 49Q35 62 27 64Q20 45 26 26Z" fill="${HAIR}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>`;
  const pony=`<g transform="rotate(${p.sway} 62 12)"><path d="M60 9Q88 -2 92 26Q94 48 80 62Q84 40 76 28Q70 19 60 17Z" fill="${HAIR}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M70 12Q86 10 88 28M78 26Q86 38 82 52" stroke="${HAIRHL}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g transform="translate(62 12) rotate(-30)"><rect x="-6" y="-4.6" width="12" height="9.2" rx="3.4" fill="${YEL}"/><rect x="-6" y="-1.5" width="12" height="3.1" fill="${BLUE}"/><rect x="-6" y="1.6" width="12" height="3" fill="${RED}"/><rect x="-6" y="-4.6" width="12" height="9.2" rx="3.4" fill="none" stroke="${INK}" stroke-width="1.8"/></g></g>`;
  const legs=tube([hipR,p.rK,p.rF],[13.5,11.5],JEANS,JEANSL)+tube([hipL,p.lK,p.lF],[13.5,11.5],JEANS,JEANSL);
  const cuffs=[p.rF,p.lF].map(f=>`<path d="M${f[0]-5.6} ${f[1]-3.4}h11.2" stroke="${INK}" stroke-width="1.6"/>`).join("");
  const shoes=[[p.rF,-2.4],[p.lF,2.4]].map(([f,dx])=>`<path d="M${f[0]-6.6+dx} ${f[1]-1}Q${f[0]+dx} ${f[1]-5} ${f[0]+6.6+dx} ${f[1]-1}Q${f[0]+10+dx} ${f[1]+3} ${f[0]+9.4+dx} ${f[1]+7.4}H${f[0]-9.4+dx}Q${f[0]-10+dx} ${f[1]+2.4} ${f[0]-6.6+dx} ${f[1]-1}Z" fill="${RED}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M${f[0]-9.6+dx} ${f[1]+5}H${f[0]+9.8+dx}" stroke="#fff" stroke-width="2.6"/><path d="M${f[0]-2.4+dx} ${f[1]-3}l3 2M${f[0]+1+dx} ${f[1]-3.6}l3 2" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>`).join("");
  const shadow=`<ellipse cx="50" cy="134.6" rx="26" ry="3.4" fill="${INK}" opacity=".16"/>`;
  const waist=`<path d="M41 77H59L60.4 91H39.6Z" fill="${JEANS}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/><path d="M41 81H59" stroke="${INK}" stroke-width="1.4"/><circle cx="50" cy="81" r="1.7" fill="${YEL}" stroke="${INK}" stroke-width="1"/><path d="M50 83V91" stroke="${INK}" stroke-width="1"/>`;
  const mid=`<path d="M42 72Q50 75.6 58 72L58.4 78H41.6Z" fill="${SKIN}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`;
  const neck=`<path d="M46 43H54L55 56Q50 60 45 56Z" fill="${SKIN}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`;
  const top=`<path d="M40 54Q50 61 60 54L59 73Q50 77 41 73Z" fill="${YEL}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/><path d="M45 57L44 49M55 57L56 49" stroke="${INK}" stroke-width="1.7" stroke-linecap="round"/><path d="M43 63Q47 66 49 63" stroke="#c99200" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  const arms=tube([rS,p.rE,p.rH],[7.4,6.4],SKIN)+tube([lS,p.lE,p.lH],[7.4,6.4],SKIN);
  const hands=fingers(p.rE,p.rH)+fingers(p.lE,p.lH)+[p.rH,p.lH].map(h=>`<circle cx="${h[0]}" cy="${h[1]}" r="4.1" fill="${SKIN}" stroke="${INK}" stroke-width="2.1"/>`).join("");
  const bracelets=[[p.rE,p.rH],[p.lE,p.lH]].map(([e,h])=>{const dx=h[0]-e[0],dy=h[1]-e[1],m=Math.hypot(dx,dy)||1;const c=[h[0]-dx/m*4.6,h[1]-dy/m*4.6];return `<circle cx="${c[0]}" cy="${c[1]}" r="3.6" fill="none" stroke="${BLUE}" stroke-width="1.9"/>`}).join("");
  const face=`<path d="M28 26Q28 9 50 8Q72 9 72 26Q72 38 64 45Q57 50 50 50Q43 50 36 45Q28 38 28 26Z" fill="${SKIN}" stroke="${INK}" stroke-width="2.8" stroke-linejoin="round"/>`;
  const feat=`${eye(39.5,30,false)}${eye(60.5,30,true)}
   <path d="M50 38.4l-1.2 1.8h2.2" stroke="${INK}" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M43.6 42Q50 49.6 56.4 42Q50 44 43.6 42Z" fill="#b01e2e" stroke="${INK}" stroke-width="1.7" stroke-linejoin="round"/><ellipse cx="50" cy="45.6" rx="2.6" ry="1.3" fill="#ff8aa0"/>
   <ellipse cx="34.4" cy="38.4" rx="4.2" ry="2.3" fill="#ff7f9b" opacity=".6"/><ellipse cx="65.6" cy="38.4" rx="4.2" ry="2.3" fill="#ff7f9b" opacity=".6"/>
   <path d="M32 37l1.6 3.2M34.6 36.6l1.6 3.2M63.8 36.6l1.6 3.2M66.4 37l1.6 3.2" stroke="#e8456a" stroke-width="1" stroke-linecap="round"/>`;
  const bangs=`<path d="M27 26Q25 5 50 5Q75 5 73 26Q70 14 62 13Q66 22 58 25Q58 14 51 13Q48 24 42 25Q44 14 37 13Q30 15 27 26Z" fill="${HAIR}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
   <path d="M30 28Q29 40 33 50Q37 42 35.6 30Z" fill="${HAIR}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M70 28Q71 40 67 50Q63 42 64.4 30Z" fill="${HAIR}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
   <path d="M36 9Q43 6 49 8M55 8Q62 6 67 11" stroke="${HAIRHL}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
   <circle cx="29.2" cy="36" r="1.9" fill="${YEL}" stroke="${INK}" stroke-width="1.2"/><circle cx="70.8" cy="36" r="1.9" fill="${YEL}" stroke="${INK}" stroke-width="1.2"/>`;
  const limbs=arms+bracelets+hands;
  return shadow+hairBack+pony+legs+cuffs+shoes+waist+mid+neck+top+(p.front?"":limbs)+face+feat+bangs+(p.front?limbs:"");
}
const ray=(x,y,r1,r2,n,rot)=>{let s="";for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
  s+=`<line x1="${x+c*r1}" y1="${y+sn*r1}" x2="${x+c*r2}" y2="${y+sn*r2}" stroke="${INK}" stroke-width="1.9" stroke-linecap="round"/>`;}return s;};
const heart=([x,y],sc)=>`<path transform="translate(${x} ${y}) scale(${sc})" d="M0 4C-8 -2 -6 -9 0 -5C6 -9 8 -2 0 4Z" fill="${RED}" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>`;
function fxBack(p){
  let s="";
  (p.ml||[]).forEach(d=>s+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round"/>`);
  return s;
}
function fx(p){
  let s="";
  (p.dash||[]).forEach(d=>s+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="3 3"/>`);
  if(p.ghost)s+=`<circle cx="${p.ghost[0]}" cy="${p.ghost[1]}" r="5" fill="none" stroke="${INK}" stroke-width="1.5" stroke-dasharray="2.4 2.4"/>`;
  (p.rays||[]).forEach(([x,y])=>s+=ray(x,y,p.big?9:7.5,p.big?17:12.5,p.big?10:7,-90+(x%7)));
  if(p.heart){s+=heart(p.heart,1.5)+heart([p.heart[0]+9,p.heart[1]-6],.9);}
  return s;
}
// focus (speed) lines + halftone corners behind each panel
function bgfx(i){
  const W=312,H=456,cx=W/2,cy=170,r0=110,R=330,n=64,tints=["#ffe27a","#9fbbea","#f4a0a8"],tint=tints[i%3];
  let s="";
  for(let k=0;k<n;k++){
    const a=(k/n)*Math.PI*2+((k*37)%11)*.004,w=.045+((k*53)%7)*.012;
    const p=(ang,r)=>`${(cx+Math.cos(ang)*r).toFixed(1)},${(cy+Math.sin(ang)*r).toFixed(1)}`;
    s+=`<polygon points="${p(a-w,R)} ${p(a+w,R)} ${p(a+((k%3)-1)*.004,r0+((k*29)%24))}" fill="${tint}" opacity=".78"/>`;
  }
  const dots=["dotY","dotB","dotR"][i%3],dots2=["dotB","dotR","dotY"][i%3];
  s+=`<polygon points="0,${H} 0,${H-170} 150,${H}" fill="url(#${dots})"/><polygon points="${W},0 ${W},120 ${W-120},0" fill="url(#${dots2})"/>`;
  return s;
}
const grid=document.getElementById("grid");
poses.forEach((p,i)=>{
  grid.insertAdjacentHTML("beforeend",
   `<div class="card"><svg class="fx" viewBox="0 0 312 456" preserveAspectRatio="none">${bgfx(i)}</svg>
    <div class="stepbox">STEP<span>${i+1}</span></div><div class="sfx" style="--sr:${p.sr}">${p.sfx}</div>
    <svg class="fig" viewBox="-16 -8 132 148">${fxBack(p)}${figure(p)}${fx(p)}</svg>
    <div class="cap"><b>${p.n}</b><i>${p.cnt}</i></div></div>`);
});

// ---- Venezuelan elements ----
const starPath="M0 -7l2 5 5 2-5 2-2 5-2-5-5-2 5-2z";
function wavyFlag(x,y,w,h,amp){
  const sh=h/3,N=24,f=(px)=>amp*Math.sin((px-x)/w*Math.PI*2.2);
  const band=(k,fill)=>{let a="",b="";
    for(let i=0;i<=N;i++){const px=x+w*i/N;a+=`${i?"L":"M"}${px.toFixed(1)} ${(y+k*sh+f(px)).toFixed(1)} `;}
    for(let i=N;i>=0;i--){const px=x+w*i/N;b+=`L${px.toFixed(1)} ${(y+(k+1)*sh+f(px)).toFixed(1)} `;}
    return `<path d="${a}${b}Z" fill="${fill}" stroke="${INK}" stroke-width="3.4" stroke-linejoin="round"/>`;};
  let st="";
  for(let i=0;i<8;i++){const t=(i-3.5)/3.5,px=x+w/2+t*w*.28,py=y+sh*1.5+sh*.18-Math.cos(t*1.15)*sh*.2+f(px);
    st+=`<path transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) scale(${(w/165).toFixed(2)})" d="${starPath}" fill="#fff" stroke="${INK}" stroke-width="1.2"/>`;}
  return band(0,YEL)+band(1,BLUE)+band(2,RED)+st;
}
document.getElementById("flagdeco").innerHTML=
  `<line x1="16" y1="14" x2="16" y2="222" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><circle cx="16" cy="12" r="8" fill="${YEL}" stroke="${INK}" stroke-width="3.4"/>`+
  wavyFlag(24,26,190,126,7)+
