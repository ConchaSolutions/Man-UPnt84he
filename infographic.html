<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Dance It Out Infographic</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--pink:#ff2d95;--cyan:#00e5ff;--yellow:#ffe600;--lime:#8cff00;--orange:#ff7a00;--violet:#a855ff;--red:#ff3b3b;--ink:#12002b;}
  html,body{margin:0;background:#12002b;}
  #art{width:1500px;height:1800px;position:relative;font-family:"Impact","Arial Black",sans-serif;color:#fff;overflow:hidden}
  h1{margin:0;text-align:center;font-size:190px;line-height:.9;letter-spacing:4px;text-transform:uppercase;
     background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;
     -webkit-text-stroke:3px #fff;paint-order:stroke fill;transform:rotate(-3deg);padding-top:60px}
  .sub{text-align:center;font-size:54px;letter-spacing:9px;color:var(--lime);margin-top:18px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 28px;padding:70px 50px 0}
  .card{border:8px solid var(--c);border-radius:32px;background:rgba(255,255,255,.06);position:relative;height:520px;
        box-shadow:0 0 0 6px rgba(0,0,0,.4),0 0 40px var(--c);transform:rotate(var(--r))}
  .num{position:absolute;top:-34px;left:-24px;width:84px;height:84px;border-radius:50%;background:var(--c);color:var(--ink);
       font-size:58px;display:flex;align-items:center;justify-content:center;border:6px solid #fff;z-index:2}
  .card svg{position:absolute;left:0;top:26px;width:100%;height:370px}
  .name{position:absolute;bottom:84px;width:100%;text-align:center;font-size:38px;color:var(--c);letter-spacing:1px;white-space:nowrap}
  .cnt{position:absolute;bottom:34px;width:100%;text-align:center;font-size:24px;color:#fff;letter-spacing:1px;white-space:nowrap}
  .beat{display:flex;justify-content:center;gap:22px;margin-top:80px}
  .beat i{width:60px;height:60px;border-radius:50%;display:block}
  .foot{text-align:center;margin-top:44px;font-size:96px;letter-spacing:8px;color:var(--yellow);text-shadow:6px 6px 0 var(--pink)}
</style></head>
<body>
<div id="art">
  <h1>Dance It Out</h1>
  <div class="sub">7 STEPS &bull; 1 BEAT &bull; NO RULES</div>
  <div class="grid" id="grid"></div>
  <div class="beat" id="beat"></div>
  <div class="foot">REPEAT. SMILE. GLOW.</div>
</div>
<script>
// Poses reconstructed from frames of a tutorial screen recording (about 3.7s, 8 fps).
// joints on a 100x140 canvas: [x,y]
const base={head:[50,18],neck:[50,32],hip:[50,80]};
const col=["#ff2d95","#00e5ff","#ffe600","#8cff00","#ff7a00","#a855ff","#ff3b3b","#00e5ff"];
const poses=[
 {n:"SPARKLE",r:"-2deg",cnt:"WIGGLE BY HEAD",
  lE:[27,36],lH:[20,8],rE:[73,36],rH:[80,8],lK:[42,106],lF:[38,134],rK:[58,106],rF:[62,134],fx:"spark"},
 {n:"SHIMMY",r:"1.5deg",cnt:"HANDS DROP, FLUTTER",
  lE:[22,52],lH:[33,40],rE:[78,52],rH:[67,40],lK:[42,106],lF:[38,134],rK:[58,106],rF:[62,134],fx:"shimmy"},
 {n:"SWING OUT",r:"-1deg",cnt:"ARMS SWEEP OUT",
  lE:[26,58],lH:[6,80],rE:[74,58],rH:[94,80],lK:[40,106],lF:[34,134],rK:[60,106],rF:[66,134],fx:"swish"},
 {n:"HIP BOUNCE",r:"2deg",cnt:"HANDS LOW, BOUNCE",
  lE:[24,60],lH:[38,82],rE:[76,60],rH:[62,82],lK:[32,104],lF:[26,134],rK:[68,104],rF:[74,134],fx:"bounce"},
 {n:"CHEST TAP",r:"-2deg",cnt:"PAT YOUR HEART",
  lE:[30,58],lH:[45,46],rE:[70,58],rH:[55,46],lK:[43,106],lF:[40,134],rK:[57,106],rF:[60,134],fx:"tap"},
 {n:"REACH & TAP",r:"1deg",cnt:"ARM OUT + TAP",
  lE:[26,40],lH:[3,30],rE:[68,60],rH:[54,47],lK:[40,106],lF:[32,134],rK:[58,106],rF:[64,134],fx:"reach"},
 {n:"BLESS & CLAP",r:"-1.5deg",cnt:"HANDS UP, CLAP",
  lE:[34,54],lH:[48,32],rE:[66,54],rH:[52,32],lK:[42,106],lF:[38,134],rK:[58,106],rF:[62,134],fx:"burst"}
];
const L=(a,b,w,c)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const star=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 -7l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="${c}"/>`;
function fx(p,c){
  const T=p.fx;
  if(T==="spark")return star(14,2,1.1,"#fff")+star(86,2,1.1,"#fff")+star(8,22,.8,c)+star(92,22,.8,c);
  if(T==="shimmy")return `<path d="M20 36q-6 4 0 8M14 34q-9 7 0 14M80 36q6 4 0 8M86 34q9 7 0 14" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(T==="swish")return `<path d="M20 52q-14 6-16 22M80 52q14 6 16 22" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="3 4"/>`;
  if(T==="bounce")return `<path d="M50 110v10m-6-5l6 7 6-7" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(T==="tap")return `<path d="M38 40l-5-5M62 40l5-5M50 36v-6" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
  if(T==="reach")return `<path d="M-4 44q4-6 0-12M-8 48q8-10 0-20" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`+`<path d="M44 40l-4-4M60 42l4-4" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
  if(T==="burst")return `<path d="M50 20v-10M36 24l-7-7M64 24l7-7M30 34l-10-2M70 34l10-2" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
  return "";
}
function figure(p,c){
  const sh=[50,38];
  const body=L(base.neck,base.hip,9,"#fff")+
    L(sh,p.lE,7,"#fff")+L(p.lE,p.lH,7,c)+L(sh,p.rE,7,"#fff")+L(p.rE,p.rH,7,c)+
    L(base.hip,p.lK,8,"#fff")+L(p.lK,p.lF,8,c)+L(base.hip,p.rK,8,"#fff")+L(p.rK,p.rF,8,c);
  const face=`<circle cx="50" cy="18" r="13" fill="${c}" stroke="#fff" stroke-width="3"/>
    <path d="M44 19 Q50 27 56 19" stroke="#12002b" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  return body+face;
}
const grid=document.getElementById("grid");
poses.forEach((p,i)=>{
  const c=col[i];
  grid.insertAdjacentHTML("beforeend",
   `<div class="card" style="--c:${c};--r:${p.r}"><div class="num">${i+1}</div>
    <svg viewBox="-14 -14 128 160" overflow="visible">${fx(p,c)}${figure(p,c)}</svg>
    <div class="name">${p.n}</div><div class="cnt">${p.cnt}</div></div>`);
});
// card 8: loop
const c8=col[7];
grid.insertAdjacentHTML("beforeend",
 `<div class="card" style="--c:${c8};--r:2deg"><div class="num">8</div>
  <svg viewBox="0 0 100 130"><g fill="none" stroke="${c8}" stroke-width="9" stroke-linecap="round">
   <path d="M20 60a32 32 0 0 1 56-20"/><path d="M80 70a32 32 0 0 1-56 20"/></g>
   <path d="M82 22l2 24-22-8z" fill="${c8}"/><path d="M18 108l-2-24 22 8z" fill="${c8}"/>
   <path d="M50 50l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#fff"/></svg>
  <div class="name">LOOP IT</div><div class="cnt">BACK TO STEP 1</div></div>`);
const beat=document.getElementById("beat");
for(let i=0;i<8;i++)beat.insertAdjacentHTML("beforeend",`<i style="background:${col[i%7]};box-shadow:0 0 24px ${col[i%7]};transform:scale(${i%2?.75:1})"></i>`);
</script></body></html>
