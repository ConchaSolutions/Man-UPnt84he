<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Dance It Out - Step by Step</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face{font-family:"Bang";src:url("fonts/Bangers.ttf")}
  @font-face{font-family:"Hand";src:url("fonts/Patrick_Hand.ttf")}
  :root{--ink:#14122b;--yellow:#ffcc00;--blue:#1d4fb8;--red:#cf142b;}
  html,body{margin:0;background:#fff}
  #art{width:1500px;height:2000px;position:relative;overflow:hidden;color:var(--ink);background:#fff;font-family:"Hand",cursive}
  .frame{position:absolute;left:22px;top:22px;width:1456px;height:1956px;border:4px solid var(--ink);box-sizing:border-box}
  .title{position:absolute;left:0;right:0;top:50px;text-align:center}
  h1{margin:0;display:inline-block;font:400 168px/1 "Bang",cursive;letter-spacing:5px;transform:skewX(-8deg);
     background:linear-gradient(180deg,#ffcc00 0 34%,#1d4fb8 34% 67%,#cf142b 67% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
     -webkit-text-stroke:10px var(--ink);paint-order:stroke fill;filter:drop-shadow(7px 7px 0 var(--ink))}
  .sub{position:absolute;left:0;right:0;top:238px;text-align:center;font:400 44px/1 "Bang",cursive;letter-spacing:6px}
  .sub b{color:var(--red);font-weight:400;margin:0 14px}
  .deco{position:absolute;top:66px}
  .grid{position:absolute;left:62px;top:316px;width:1376px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{position:relative;height:536px;border:4px solid var(--ink);box-sizing:border-box;background:transparent}
  .card svg.fig{position:absolute;left:0;top:14px;width:100%;height:376px;overflow:visible}
  .badge{position:absolute;left:-4px;top:-4px;width:76px;height:76px;background:var(--ink);color:#fff;font:400 58px/76px "Bang",cursive;text-align:center;z-index:3}
  .badge.y{color:var(--yellow)}
  .txt{position:absolute;left:18px;right:18px;bottom:14px;text-align:center}
  .txt b{display:block;font:400 42px/1.05 "Bang",cursive;letter-spacing:2px;white-space:nowrap}
  .txt b em{font-style:normal;color:var(--red)}
  .txt i{display:block;font:400 27px/1.15 "Hand",cursive;font-style:normal;margin-top:6px;min-height:62px}
  .last{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .last .tag{font:400 66px/1.05 "Bang",cursive;letter-spacing:4px;text-align:center;margin-top:8px;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;transform:skewX(-8deg)}
  .last .tag span{display:block}
  .last .tag .r{color:var(--red)} .last .tag .b{color:#3b7bff} .last .tag .y{color:var(--yellow)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1d4fb8" stroke="#1d4fb8" stroke-width="1" stroke-linejoin="round"/></marker>
</defs></svg>
<div id="art">
  <div class="frame"></div>
  <svg class="deco" style="left:64px" width="190" height="190" viewBox="0 0 190 190" id="flagdeco"></svg>
  <svg class="deco" style="right:64px" width="190" height="190" viewBox="0 0 190 190" id="starsdeco"></svg>
  <div class="title"><h1>DANCE IT OUT</h1></div>
  <div class="sub">8 STEPS<b>&#9733;</b>1 BEAT<b>&#9733;</b>SABOR VENEZOLANO</div>
  <div class="grid" id="grid"></div>
</div>
<script>
const INK="#14122b", RED="#cf142b", BLUE="#1d4fb8", YEL="#ffcc00";
const SKIN="#ffe6d0", SKINSH="#f1bd9a", HAIR="#1d1b34", HAIRHL="#8896dd";
const JEANS="#5a8fe0", JEANSSH="#3f6cc0", JEANSL="#b4d2fb", TOPSH="#e0a800";
// Sequence given by the client. "Right" = the dancer's own right (the viewer's left).
const std={rK:[42,114],rF:[39,140],lK:[58,114],lF:[61,140]};
const poses=[
 {n:"HANDS ON <em>HEAD</em>",cnt:"Lift both hands and rest them on the sides of your head.",sway:8,front:true,
  rE:[13,36],rH:[28,15],lE:[87,36],lH:[72,15],...std,
  A:["M6 72Q-6 44 14 22","M94 72Q106 44 86 22"]},
 {n:"HANDS ON <em>SHOULDERS</em>",cnt:"Slide both hands down onto your shoulders.",sway:-8,
  rE:[20,66],rH:[34,47],lE:[80,66],lH:[66,47],...std,
  A:["M22 14Q10 30 24 42","M78 14Q90 30 76 42"]},
 {n:"HANDS ON <em>HIPS</em>",cnt:"Drop both hands down to your hips.",sway:12,
  rE:[20,66],rH:[41,80],lE:[80,66],lH:[59,80],rK:[40,114],rF:[34,140],lK:[60,114],lF:[66,140],
  A:["M10 50Q-2 70 30 82","M90 50Q102 70 70 82"]},
 {n:"CHEST <em>TAP</em>",cnt:"Pat the center of your chest with both hands.",sway:-10,
  rE:[24,70],rH:[40,60],lE:[76,70],lH:[60,60],...std,
  A:["M12 84Q8 64 30 60","M88 84Q92 64 70 60"]},
 {n:"RIGHT ARM <em>OUT</em>",cnt:"Stretch your right arm out to the side. Touch its forearm with your left hand.",sway:20,
  rE:[12,50],rH:[-12,50],lE:[38,67],lH:[14,53],...std,
  A:["M24 36L-6 36","M52 90Q20 90 12 62"],circ:[[14,53]]},
 {n:"SLIDE TO THE <em>SHOULDER</em>",cnt:"Slide your left hand up your right arm to the right shoulder.",sway:16,
  rE:[12,50],rH:[-12,50],lE:[52,70],lH:[35,49],...std,
  A:["M-8 38L26 38"],circ:[[35,49]]},
 {n:"HEART <em>TAP</em>",cnt:"Reach your left hand out, then tap your heart.",sway:14,
  rE:[12,50],rH:[-12,50],lE:[72,70],lH:[56,58],...std,ghost:[92,40],
  A:["M90 49Q92 70 64 62"],circ:[[56,58]]},
 {n:"<em>CLAP</em>",cnt:"Bring both hands together in the center and clap.",sway:-6,
  rE:[32,68],rH:[49,56],lE:[68,68],lH:[51,56],rK:[43,114],rF:[41,140],lK:[57,114],lF:[59,140],
  A:["M22 56L40 56","M78 56L60 56"],burst:[50,56]}
];
const L=(a,b,w,c,x="")=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;
// outlined limb with simple cel shading (shadow on the lower/right side, gloss on the other)
function tube(pts,ws,fill,shade,gloss){
  let o="",f="",sh="",gl="";
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy)||1;
    let nx=-dy/m,ny=dx/m;if(nx*0.6+ny*0.8<0){nx=-nx;ny=-ny;}
    o+=L(a,b,ws[i]+4,INK);f+=L(a,b,ws[i],fill);
    const k=ws[i]*.27,t=[nx*k,ny*k],sa=[a[0]+t[0]+dx*.04,a[1]+t[1]+dy*.04],sb=[b[0]+t[0]-dx*.04,b[1]+t[1]-dy*.04];
    sh+=L(sa,sb,ws[i]*.4,shade);
    if(gloss){const g=[-nx*ws[i]*.22,-ny*ws[i]*.22];gl+=L([a[0]+g[0]+dx*.18,a[1]+g[1]+dy*.18],[b[0]+g[0]-dx*.18,b[1]+g[1]-dy*.18],1.5,gloss,'opacity=".75"');}
  }
  return o+f+sh+gl;
}
function hand(e,h){
  const dx=h[0]-e[0],dy=h[1]-e[1],m=Math.hypot(dx,dy)||1,ux=dx/m,uy=dy/m;let s="";
  [[-34,.92],[0,1.12],[34,.92],[-82,.64]].forEach(([a,len])=>{
    const r=a*Math.PI/180,c=Math.cos(r),sn=Math.sin(r),vx=ux*c-uy*sn,vy=ux*sn+uy*c;
    const p0=[h[0]+vx*2.6,h[1]+vy*2.6],p1=[h[0]+vx*(2.6+6.6*len),h[1]+vy*(2.6+6.6*len)];
    s+=L(p0,p1,5.2,INK)+L(p0,p1,3,SKIN);
  });
  return s+`<circle cx="${h[0]}" cy="${h[1]}" r="4.8" fill="${SKIN}" stroke="${INK}" stroke-width="2.2"/>`+
    `<path d="M${h[0]-2.6} ${h[1]+2.2}Q${h[0]} ${h[1]+4} ${h[0]+2.6} ${h[1]+2.2}" stroke="${SKINSH}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;
}
function eye(cx,cy,flip){
  const s=flip?-1:1,k=.86;
  return `<ellipse cx="${cx}" cy="${cy}" rx="${6.4*k}" ry="${8*k}" fill="#fff" stroke="${INK}" stroke-width=".9"/>
   <ellipse cx="${cx}" cy="${cy+.4}" rx="${5.1*k}" ry="${7.1*k}" fill="#2a1712"/>
   <ellipse cx="${cx}" cy="${cy+3}" rx="${4.3*k}" ry="${3.5*k}" fill="#a55a2c"/>
   <ellipse cx="${cx}" cy="${cy+.2}" rx="${2.3*k}" ry="${3.5*k}" fill="#0b0707"/>
   <circle cx="${cx-1.8*s}" cy="${cy-2.6}" r="2.1" fill="#fff"/><circle cx="${cx+2*s}" cy="${cy+3.3}" r="1" fill="#fff"/>
   <path d="M${cx-7*k} ${cy-2.4}Q${cx-3.2*k} ${cy-10*k} ${cx+2.4*k} ${cy-8.8*k}Q${cx+6.4*k} ${cy-7.8*k} ${cx+7.4*k} ${cy-1.6}" stroke="${INK}" stroke-width="2.8" fill="none" stroke-linecap="round"/>
   <path d="M${cx+7*k*s} ${cy-2.6}l${3.2*s} -2.4M${cx+6.4*k*s} ${cy-5.2}l${2.8*s} -2.8" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/>`;
}
function figure(p){
  const rS=[39,50],lS=[61,50],hipR=[44,88],hipL=[56,88];
  const hairBack=`<path d="M30 24Q27 1 50 1Q73 1 70 24Q77 46 71 68Q62 66 61 53L39 53Q38 66 29 68Q23 46 30 24Z" fill="${HAIR}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M32 30Q31 46 34 60M68 30Q69 46 66 60" stroke="${HAIRHL}" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".8"/>`;
  const pony=`<g transform="rotate(${p.sway} 60 9)"><path d="M58 6Q92 -6 96 28Q98 54 83 70Q89 44 79 30Q70 19 58 17Z" fill="${HAIR}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M70 9Q90 8 92 30M80 28Q90 42 85 58" stroke="${HAIRHL}" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <g transform="translate(60 9) rotate(-30)"><rect x="-6.4" y="-5" width="12.8" height="10" rx="3.6" fill="${YEL}"/><rect x="-6.4" y="-1.7" width="12.8" height="3.3" fill="${BLUE}"/><rect x="-6.4" y="1.7" width="12.8" height="3.3" fill="${RED}"/><rect x="-6.4" y="-5" width="12.8" height="10" rx="3.6" fill="none" stroke="${INK}" stroke-width="1.9"/></g></g>`;
  const legs=tube([hipR,p.rK,p.rF],[15.6,13],JEANS,JEANSSH,JEANSL)+tube([hipL,p.lK,p.lF],[15.6,13],JEANS,JEANSSH,JEANSL);
  const folds=[p.rK,p.lK].map(k=>`<path d="M${k[0]-4.6} ${k[1]-3.6}q4.6 2.4 9.2 0M${k[0]-4} ${k[1]+1.4}q4 2 8 0" stroke="${JEANSSH}" stroke-width="1" fill="none" stroke-linecap="round"/>`).join("");
  const seams=[[hipR,p.rK],[hipL,p.lK]].map(([a,b])=>L(a,b,.8,JEANSSH,'stroke-dasharray="1.6 1.4"')).join("");
  const cuffs=[p.rF,p.lF].map(f=>`<path d="M${f[0]-6.4} ${f[1]-5}h12.8" stroke="${INK}" stroke-width="1.8"/>`).join("");
  const shoes=[[p.rF,-2.6],[p.lF,2.6]].map(([f,dx])=>`<path d="M${f[0]-7.4+dx} ${f[1]-1}Q${f[0]+dx} ${f[1]-5.4} ${f[0]+7.4+dx} ${f[1]-1}Q${f[0]+11+dx} ${f[1]+3} ${f[0]+10.4+dx} ${f[1]+8.6}H${f[0]-10.4+dx}Q${f[0]-11+dx} ${f[1]+2.6} ${f[0]-7.4+dx} ${f[1]-1}Z" fill="${RED}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M${f[0]-10.6+dx} ${f[1]+6}H${f[0]+10.8+dx}" stroke="#fff" stroke-width="2.8"/><path d="M${f[0]-3+dx} ${f[1]-3.4}l3.4 2.2M${f[0]+1+dx} ${f[1]-4}l3.4 2.2" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M${f[0]-8+dx} ${f[1]+1}Q${f[0]-3+dx} ${f[1]-2} ${f[0]+dx} ${f[1]-3}" stroke="#a30f21" stroke-width="1.2" fill="none"/>`).join("");
  const shadow=`<ellipse cx="50" cy="149.4" rx="30" ry="3.4" fill="${INK}" opacity=".12"/>`;
  const waist=`<path d="M40 80H60L62.6 96H37.4Z" fill="${JEANS}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M40.4 84.4H59.6" stroke="${INK}" stroke-width="1.5"/><circle cx="50" cy="84.4" r="1.9" fill="${YEL}" stroke="${INK}" stroke-width="1"/>
    <path d="M50 86.4V96M43.4 86.6l-1.6 6.4M56.6 86.6l1.6 6.4" stroke="${JEANSSH}" stroke-width="1" stroke-linecap="round"/>
    <path d="M41 81.6V84.4M46 81.6V84.4M54 81.6V84.4M59 81.6V84.4" stroke="${INK}" stroke-width=".9"/>`;
  const mid=`<path d="M40.6 70Q50 74.4 59.4 70L60 82H40Z" fill="${SKIN}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/><path d="M52.6 72Q56.6 76 56 81" stroke="${SKINSH}" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="50" cy="76" r=".9" fill="${INK}"/>`;
  const neck=`<path d="M45.4 37H54.6L55.6 51Q50 55 44.4 51Z" fill="${SKIN}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/><path d="M50 41Q54 44 55 50" stroke="${SKINSH}" stroke-width="2" fill="none"/>`;
  const top=`<path d="M38.4 48Q50 56 61.6 48L60.2 72Q50 76 39.8 72Z" fill="${YEL}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M52 64Q58 66 60 71L58 71.6Q54 71 52 66Z" fill="${TOPSH}" opacity=".8"/>
    <path d="M44 52Q50 57 56 52M40.6 69.4Q50 73.4 59.4 69.4" stroke="${INK}" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M40 71Q50 75 60 71" stroke="${BLUE}" stroke-width="1.8" fill="none"/>
    <circle cx="50" cy="60.4" r="2.6" fill="none" stroke="${INK}" stroke-width="1.3"/><path d="M44.4 52L43.4 42M55.6 52L56.6 42" stroke="${INK}" stroke-width="1.7" stroke-linecap="round"/>`;
  const arms=tube([rS,p.rE,p.rH],[7.8,6.6],SKIN,SKINSH,null)+tube([lS,p.lE,p.lH],[7.8,6.6],SKIN,SKINSH,null);
  const bracelets=[[p.rE,p.rH],[p.lE,p.lH]].map(([e,h])=>{const dx=h[0]-e[0],dy=h[1]-e[1],m=Math.hypot(dx,dy)||1;const c=[h[0]-dx/m*5.2,h[1]-dy/m*5.2];return `<circle cx="${c[0]}" cy="${c[1]}" r="3.9" fill="none" stroke="${BLUE}" stroke-width="2"/>`}).join("");
  const hands=hand(p.rE,p.rH)+hand(p.lE,p.lH);
  const face=`<path d="M33 22Q33 6 50 5Q67 6 67 22Q67 33 60 39Q55 43 50 43Q45 43 40 39Q33 33 33 22Z" fill="${SKIN}" stroke="${INK}" stroke-width="2.7" stroke-linejoin="round"/>`;
  const feat=`${eye(42,24,false)}${eye(58,24,true)}
   <path d="M50 30.6l-1.1 1.8h2.1" stroke="${INK}" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M44.4 34.4Q50 41 55.6 34.4Q50 36 44.4 34.4Z" fill="#b01e2e" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="50" cy="38" rx="2.3" ry="1.1" fill="#ff8aa0"/>
   <ellipse cx="37.4" cy="31" rx="3.6" ry="2" fill="#ff7f9b" opacity=".6"/><ellipse cx="62.6" cy="31" rx="3.6" ry="2" fill="#ff7f9b" opacity=".6"/>`;
  const bangs=`<path d="M32 23Q30 3 50 3Q70 3 68 23Q65 13 58 12Q62 20 55 22Q55 12 50 11Q47 21 42 22Q44 13 38 12Q33 14 32 23Z" fill="${HAIR}" stroke="${INK}" stroke-width="2.3" stroke-linejoin="round"/>
   <path d="M33.4 25Q32.4 36 36.4 46Q40 38 38.4 27Z" fill="${HAIR}" stroke="${INK}" stroke-width="1.9" stroke-linejoin="round"/><path d="M66.6 25Q67.6 36 63.6 46Q60 38 61.6 27Z" fill="${HAIR}" stroke="${INK}" stroke-width="1.9" stroke-linejoin="round"/>
   <path d="M38 8Q44 5 50 6.6M55 6.6Q62 5 66 10" stroke="${HAIRHL}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
   <circle cx="33.6" cy="29" r="1.8" fill="${YEL}" stroke="${INK}" stroke-width="1.1"/><circle cx="66.4" cy="29" r="1.8" fill="${YEL}" stroke="${INK}" stroke-width="1.1"/>`;
  const rl=[["R",p.rF[0]-19],["L",p.lF[0]+19]].map(([t,x])=>`<circle cx="${x}" cy="143" r="5.6" fill="#fff" stroke="${INK}" stroke-width="1.3"/><text x="${x}" y="145.8" font-family="Bang" font-size="8" text-anchor="middle" fill="${INK}">${t}</text>`).join("");
  const glow=(p.circ||[p.rH,p.lH]).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10.5" fill="${RED}" opacity=".2"/><circle cx="${x}" cy="${y}" r="10.5" fill="none" stroke="${RED}" stroke-width="1.1" stroke-dasharray="3 2.4" opacity=".7"/>`).join("");
  const limbs=glow+arms+bracelets+hands;
  return shadow+rl+hairBack+pony+legs+folds+seams+cuffs+shoes+waist+mid+neck+top+(p.front?"":limbs)+face+feat+bangs+(p.front?limbs:"");
}
// teaching overlays: red ring = target, blue arrow = direction of travel
function overlay(p){
  let s="";
  const halo=d=>`<path d="${d}" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/>`;
  (p.A||[]).forEach(d=>s+=halo(d)+`<path d="${d}" fill="none" stroke="${BLUE}" stroke-width="2.3" stroke-linecap="round" marker-end="url(#ah)"/>`);
  if(p.ghost)s+=`<circle cx="${p.ghost[0]}" cy="${p.ghost[1]}" r="6.6" fill="none" stroke="${INK}" stroke-width="1.5" stroke-dasharray="2.6 2.6"/>`;
  if(p.burst){const[x,y]=p.burst;s+=`<g stroke="${INK}" stroke-width="2" stroke-linecap="round"><path d="M${x} ${y-12}v-7M${x-9} ${y-8}l-5-5M${x+9} ${y-8}l5-5"/></g>`;}
  return s;
}
const grid=document.getElementById("grid");
poses.forEach((p,i)=>{
  grid.insertAdjacentHTML("beforeend",
   `<div class="card"><div class="badge${i%2?' y':''}">${i+1}</div>
    <svg class="fig" viewBox="-22 -4 144 158">${figure(p)}${overlay(p)}</svg>
    <div class="txt"><b>${p.n}</b><i>${p.cnt}</i></div></div>`);
});

// ---- Venezuelan elements ----
const starPath="M0 -7l2 5 5 2-5 2-2 5-2-5-5-2 5-2z";
function wavyFlag(x,y,w,h,amp){
  const sh=h/3,N=24,f=(px)=>amp*Math.sin((px-x)/w*Math.PI*2.2);
  const band=(k,fill)=>{let a="",b="";
    for(let i=0;i<=N;i++){const px=x+w*i/N;a+=`${i?"L":"M"}${px.toFixed(1)} ${(y+k*sh+f(px)).toFixed(1)} `;}
    for(let i=N;i>=0;i--){const px=x+w*i/N;b+=`L${px.toFixed(1)} ${(y+(k+1)*sh+f(px)).toFixed(1)} `;}
    return `<path d="${a}${b}Z" fill="${fill}" stroke="${INK}" stroke-width="3.2" stroke-linejoin="round"/>`;};
  let st="";
  for(let i=0;i<8;i++){const t=(i-3.5)/3.5,px=x+w/2+t*w*.28,py=y+sh*1.5+sh*.18-Math.cos(t*1.15)*sh*.2+f(px);
    st+=`<path transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) scale(${(w/165).toFixed(2)})" d="${starPath}" fill="#fff" stroke="${INK}" stroke-width="1.2"/>`;}
  return band(0,YEL)+band(1,BLUE)+band(2,RED)+st;
}
document.getElementById("flagdeco").innerHTML=
  `<line x1="14" y1="20" x2="14" y2="178" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><circle cx="14" cy="18" r="7" fill="${YEL}" stroke="${INK}" stroke-width="3"/>`+wavyFlag(20,30,158,106,6);
(function(){
  let s="";
  for(let i=0;i<8;i++){const t=(i-3.5)/3.5,x=95+t*82,y=130-Math.cos(t*1.15)*22;
    s+=`<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${i%2?2.2:2.7}) rotate(${(i%3-1)*8})" d="${starPath}" fill="${i%2?YEL:"#fff"}" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>`;}
  document.getElementById("starsdeco").innerHTML=s;
})();
// 9th panel: flag + tagline
grid.insertAdjacentHTML("beforeend",
 `<div class="card last"><svg width="330" height="250" viewBox="0 0 330 250" id="lastflag"></svg>
   <div class="tag"><span class="r">REPEAT.</span><span class="b">SMILE.</span><span class="y">GLOW.</span></div></div>`);
document.getElementById("lastflag").innerHTML=
  `<line x1="22" y1="14" x2="22" y2="240" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><circle cx="22" cy="12" r="8" fill="${YEL}" stroke="${INK}" stroke-width="3.2"/>`+wavyFlag(30,26,282,188,9);
</script></body></html>
