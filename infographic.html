<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Dance Moves - Step by Step</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face{font-family:"Slab";src:url("fonts/Alfa_Slab_One.ttf")}
  @font-face{font-family:"Didot";src:url("fonts/Abril_Fatface.ttf")}
  :root{--navy:#23455e;--sage:#7f9669;--pale:#dde5df;--paleD:#b0beb6;}
  html,body{margin:0;background:#fff}
  #art{width:1500px;height:2850px;position:relative;overflow:hidden;background:#fff;color:var(--navy)}
  .rule{position:absolute;left:70px;right:70px;height:12px;border-top:6px solid var(--paleD);border-bottom:2px solid var(--paleD);box-sizing:border-box}
  .title{position:absolute;left:0;right:0;top:78px;text-align:center}
  .t1{font:400 112px/1 "Slab",serif;letter-spacing:12px;color:var(--sage)}
  .t2{font:400 168px/1 "Slab",serif;letter-spacing:4px;color:var(--navy);margin-top:6px;white-space:nowrap}
  .sec{position:absolute;left:70px;right:70px}
  .row{display:flex;height:620px}
  .frame{position:relative;flex:1}
  .num{position:absolute;left:0px;bottom:58px;font:400 500px/0.8 "Didot",serif;color:var(--pale);-webkit-text-stroke:3px var(--paleD);
       text-shadow:-3px 3px 0 var(--paleD),-6px 6px 0 var(--paleD),-9px 9px 0 var(--paleD),-12px 12px 0 #c6d2cb;z-index:0}
  .frame svg{position:absolute;left:0;top:0;width:100%;height:578px;z-index:1;overflow:visible}
  .photo{position:absolute;left:0;top:0;width:100%;height:578px;object-fit:contain;object-position:center bottom;z-index:1}
  .cap{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:400 25px/1 "Slab",serif;letter-spacing:2px;color:var(--navy);z-index:2;white-space:nowrap}
  .name{height:112px;margin-top:6px;text-align:center;font:400 104px/112px "Slab",serif;letter-spacing:6px;color:var(--pale);-webkit-text-stroke:3px var(--paleD);
        text-shadow:-3px 3px 0 var(--paleD),-5px 5px 0 var(--paleD),-7px 7px 0 #c6d2cb;white-space:nowrap}
  .foot{position:absolute;left:0;right:0;bottom:52px;text-align:center;font:400 26px/1 "Slab",serif;letter-spacing:6px;color:var(--paleD)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10L3 5Z" fill="#23455e"/></marker>
</defs></svg>
<div id="art">
  <div class="rule" style="top:44px"></div>
  <div class="title"><div class="t1">TOCO TOCO</div><div class="t2">DANCE MOVES</div></div>
  <div class="rule" style="top:392px"></div>
  <div id="secs"></div>
  <div class="foot">LEARN IT &middot; REPEAT ON THE BEAT</div>
</div>
<script>
// ---------- palette ----------
const C={navy:"#23455e",navyL:"#3f6786",navyD:"#142d3f",sage:"#7f9669",sageL:"#9bb084",sageD:"#5f7650",
  skin:"#cf9264",skinL:"#e6b78c",skinD:"#a2663f",hair:"#162a3b",hairL:"#2a4a63",lip:"#9c4a3e",
  shoe:"#f1f3ec",shoeD:"#c5cbbf",ground:"#aebca0"};
// ---------- vector helpers ----------
const f1=n=>Math.round(n*100)/100;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]), norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l]};
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const rot=(p,c,deg)=>{const r=deg*Math.PI/180,s=Math.sin(r),co=Math.cos(r),x=p[0]-c[0],y=p[1]-c[1];return [c[0]+x*co-y*s,c[1]+x*s+y*co]};
const P=pts=>pts.map(p=>f1(p[0])+","+f1(p[1])).join(" ");
const poly=(pts,fill)=>`<polygon points="${P(pts)}" fill="${fill}"/>`;
const circ=(c,r,fill)=>`<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(r)}" fill="${fill}"/>`;
function seg(a,b,w0,w1,fill){ // tapered capsule
  const d=norm(sub(b,a)),n=[-d[1],d[0]];
  return poly([add(a,mul(n,w0/2)),add(b,mul(n,w1/2)),sub(b,mul(n,w1/2)),sub(a,mul(n,w0/2))],fill)+circ(a,w0/2,fill)+circ(b,w1/2,fill);
}
// limb with flat 3-tone shading: light strip up/left, shadow strip down/right
function strip(a,b,w0,w1,off,wd,fill){ // flat faceted strip, trimmed so it never reaches the joints
  const d=norm(sub(b,a)),n=[-d[1],d[0]],t0=-.3,t1=1.3;
  const A=lerp(a,b,t0),B=lerp(a,b,t1),wa=(w0+(w1-w0)*t0),wb=(w0+(w1-w0)*t1);
  const sg=off<0?-1:1,cA=add(A,mul(n,sg*Math.abs(off)*wa)),cB=add(B,mul(n,sg*Math.abs(off)*wb));
  return poly([add(cA,mul(n,wd*wa/2)),add(cB,mul(n,wd*wb/2)),sub(cB,mul(n,wd*wb/2)),sub(cA,mul(n,wd*wa/2))],fill);
}
function limb(a,b,w0,w1,base,hi,sh){
  const d=norm(sub(b,a));let n=[-d[1],d[0]];const flip=(n[0]*.6+n[1]*.8>0)?-1:1;
  const id="L"+(clipN++),q=[add(a,mul(n,w0/2)),add(b,mul(n,w1/2)),sub(b,mul(n,w1/2)),sub(a,mul(n,w0/2))];
  const clip=`<clipPath id="${id}"><polygon points="${P(q)}"/><circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${f1(w0/2)}"/><circle cx="${f1(b[0])}" cy="${f1(b[1])}" r="${f1(w1/2)}"/></clipPath>`;
  return seg(a,b,w0,w1,base)+clip+`<g clip-path="url(#${id})">${strip(a,b,w0,w1,.27*flip,.26,hi)}${strip(a,b,w0,w1,-.30*flip,.30,sh)}</g>`;
}
// clip a set of shapes to a polygon (used for garment shading)
let clipN=0;
function clipped(pts,inner){const id="k"+(clipN++);return `<clipPath id="${id}"><polygon points="${P(pts)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`;}

// ---------- parts ----------
function hand(e,h){
  const d=norm(sub(h,e));let n=[-d[1],d[0]];if((50-h[0])*n[0]<0)n=[-n[0],-n[1]];
  const ang=Math.atan2(d[1],d[0])*180/Math.PI-90;
  let s=`<ellipse cx="${f1(h[0])}" cy="${f1(h[1])}" rx="4.7" ry="6.2" transform="rotate(${f1(ang)} ${f1(h[0])} ${f1(h[1])})" fill="${C.skin}"/>`;
  s+=seg(add(add(h,mul(n,3.4)),mul(d,-1.6)),add(add(h,mul(n,4.4)),mul(d,3.2)),3.2,2.6,C.skinL);
  s+=`<line x1="${f1(h[0]+d[0]*3.4+n[0]*1.5)}" y1="${f1(h[1]+d[1]*3.4+n[1]*1.5)}" x2="${f1(h[0]+d[0]*6.2+n[0]*1.5)}" y2="${f1(h[1]+d[1]*6.2+n[1]*1.5)}" stroke="${C.skinD}" stroke-width=".7"/>`;
  s+=`<line x1="${f1(h[0]+d[0]*3.4-n[0]*1.5)}" y1="${f1(h[1]+d[1]*3.4-n[1]*1.5)}" x2="${f1(h[0]+d[0]*6.2-n[0]*1.5)}" y2="${f1(h[1]+d[1]*6.2-n[1]*1.5)}" stroke="${C.skinD}" stroke-width=".7"/>`;
  return s;
}
function shoe(a,d){ // d: toe direction (-1 left, +1 right)
  const X=(dx)=>a[0]+d*dx;
  const body=[[X(-6.5),a[1]-1],[X(5.5),a[1]-1],[X(12),a[1]+7],[X(14.5),a[1]+10],[X(14.5),a[1]+12.5],[X(-7.5),a[1]+12.5],[X(-7.5),a[1]+3]];
  return poly(body,C.shoe)+poly([[X(-7.5),a[1]+9.6],[X(14.5),a[1]+9.6],[X(14.5),a[1]+12.5],[X(-7.5),a[1]+12.5]],C.shoeD)+
    poly([[X(-6),a[1]+3],[X(3),a[1]+1.4],[X(5),a[1]+6.4],[X(-6.5),a[1]+8]],C.sage)+
    poly([[X(5.5),a[1]-1],[X(6.5),a[1]+.4],[X(12),a[1]+7],[X(9),a[1]+3]],C.shoeD);
}
function headParts(hx,hy,tilt){
  const R=(x,y)=>rot([hx+x,hy+y],[hx,hy],tilt);
  const hairBack=poly([[-11,-8],[-8.5,-15],[0,-17.5],[9,-15.5],[12,-7],[13.5,10],[15,26],[9,33],[6,21],[-6,21],[-9.5,34],[-15.5,26],[-13.5,8]].map(p=>R(p[0],p[1])),C.hair)+
    poly([[-8.5,-15],[0,-17.5],[3.5,-10],[-6,-6]].map(p=>R(p[0],p[1])),C.hairL)+
    poly([[10.5,-4],[13.5,10],[15,26],[11.5,12]].map(p=>R(p[0],p[1])),C.hairL);
  const face=poly([[0,-12.5],[7.8,-9.6],[9.9,-1.5],[7.4,7.8],[3.2,12.6],[-3.2,12.6],[-7.4,7.8],[-9.9,-1.5],[-7.8,-9.6]].map(p=>R(p[0],p[1])),C.skin)+
    poly([[2.2,-12.4],[7.8,-9.6],[9.9,-1.5],[7.4,7.8],[3.2,12.6],[1.8,9],[3.8,0]].map(p=>R(p[0],p[1])),C.skinD)+
    poly([[0,-1],[2.2,4.6],[-.7,4.8]].map(p=>R(p[0],p[1])),C.skinD)+
    poly([[-3.4,7.6],[0,6.8],[3.4,7.6],[0,9.8]].map(p=>R(p[0],p[1])),C.lip);
  const eyes=[[-4.2,-1.2],[4.2,-1.2]].map(([x,y])=>{const a=R(x-2,y),b=R(x,y-1.3),c=R(x+2,y);return `<path d="M${f1(a[0])} ${f1(a[1])}Q${f1(b[0])} ${f1(b[1])} ${f1(c[0])} ${f1(c[1])}" stroke="${C.navyD}" stroke-width="1.15" fill="none" stroke-linecap="round"/>`}).join("");
  const brows=[[-6.6,-4.4,-1.8,-5.2],[1.8,-5.2,6.6,-4.4]].map(([x1,y1,x2,y2])=>{const a=R(x1,y1),b=R(x2,y2);return `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${C.hair}" stroke-width=".9" stroke-linecap="round"/>`}).join("");
  const hairFront=poly([[-10.2,-2],[-9,-10],[-4,-14.5],[4,-14.5],[9.4,-9.5],[10.2,-1.5],[6.5,-7.5],[1,-9],[-3,-7],[-7,-3]].map(p=>R(p[0],p[1])),C.hair)+
    poly([[-4,-14.5],[4,-14.5],[1,-9.6],[-3.4,-8]].map(p=>R(p[0],p[1])),C.hairL);
  return {hairBack,face:face+eyes+brows,hairFront};
}
// ---------- whole figure ----------
function figure(p){
  const sR=p.sR,sL=p.sL,hR=p.hR,hL=p.hL;
  const sc=lerp(sR,sL,.5),hc=lerp(hR,hL,.5),dirS=norm(sub(sL,sR)),dirH=norm(sub(hL,hR));
  const wc=lerp(sc,hc,.6),wR=sub(wc,mul(dirS,8.8)),wL=add(wc,mul(dirS,8.8));
  const hRo=sub(hR,mul(dirH,3.5)),hLo=add(hL,mul(dirH,3.5));
  const H=headParts(p.hd[0],p.hd[1],p.ht);
  let s="";
  s+=`<ellipse cx="50" cy="178" rx="44" ry="6.5" fill="${C.ground}"/>`;
  s+=H.hairBack;
  // legs (wide-leg jeans) + shoes
  s+=limb(hR,p.rK,21,16.5,C.navy,C.navyL,C.navyD)+limb(p.rK,p.rA,16.5,17,C.navy,C.navyL,C.navyD);
  s+=limb(hL,p.lK,21,16.5,C.navy,C.navyL,C.navyD)+limb(p.lK,p.lA,16.5,17,C.navy,C.navyL,C.navyD);
    s+=shoe(p.rA,p.dR)+shoe(p.lA,p.dL);
  // torso skin
  const torso=[sR,sL,wL,hLo,hRo,wR];
  s+=poly(torso,C.skin)+clipped(torso,poly([lerp(sR,sL,.66),sL,hLo,lerp(hRo,hLo,.66)],C.skinD)+poly([sR,lerp(sR,sL,.18),lerp(wR,wL,.18),wR],C.skinL));
  // jeans waist
  const jtR=lerp(wR,hRo,.52),jtL=lerp(wL,hLo,.52);
  const jw=[jtR,jtL,hLo,hRo];
  s+=poly(jw,C.navy)+clipped(jw,poly([lerp(jtR,jtL,.68),jtL,hLo,lerp(hRo,hLo,.68)],C.navyD)+poly([jtR,lerp(jtR,jtL,.2),lerp(hRo,hLo,.2),hRo],C.navyL))+
    poly([jtR,jtL,add(jtL,[0,4.2]),add(jtR,[0,4.2])],C.navyD)+circ(lerp(jtR,jtL,.5),1.5,C.sage);
  // crop top (halter)
  const A=lerp(sR,sL,.2),B=lerp(sR,sL,.8),N=add(sc,[0,6.5]);
  const tR=lerp(sR,wR,.8),tL=lerp(sL,wL,.8),top=[A,N,B,tL,tR];
  s+=poly(top,C.sage)+clipped(top,poly([lerp(tR,tL,.66),tL,B,N],C.sageD)+poly([tR,lerp(tR,tL,.2),A,add(A,[-4,0])],C.sageL))+
    poly([lerp(tR,tL,.38),lerp(tR,tL,.62),add(lerp(tR,tL,.5),[0,3.4])],C.sageD);
  s+=seg(A,add(sc,[-3.4,-4.2]),3,2.6,C.sage)+seg(B,add(sc,[3.4,-4.2]),3,2.6,C.sageD);
  // neck
  s+=poly([[p.hd[0]-4.3,p.hd[1]+9],[p.hd[0]+4.3,p.hd[1]+9],add(sc,[4.8,1]),add(sc,[-4.8,1])],C.skin)+poly([[p.hd[0]+1,p.hd[1]+9],[p.hd[0]+4.3,p.hd[1]+9],add(sc,[4.8,1]),add(sc,[1.6,1])],C.skinD);
  const arms=
    limb(sR,p.rE,9.4,8.2,C.skin,C.skinL,C.skinD)+limb(p.rE,p.rH,8,6.4,C.skin,C.skinL,C.skinD)+hand(p.rE,p.rH)+
    limb(sL,p.lE,9.4,8.2,C.skin,C.skinL,C.skinD)+limb(p.lE,p.lH,8,6.4,C.skin,C.skinL,C.skinD)+hand(p.lE,p.lH);
  if(!p.front)s+=arms;
  s+=H.face+H.hairFront;
  if(p.front)s+=arms;
  return s;
}
// ---------- poses ----------
const stA={hR:[41.5,87.5],hL:[57,91],rK:[40,128],rA:[38.5,168],lK:[65,126],lA:[73,163],dR:-1,dL:1};
const stB={hR:[43,91],hL:[58.5,87.5],rK:[35,126],rA:[27,163],lK:[60,128],lA:[61.5,168],dR:-1,dL:1};
const stW={hR:[43,90],hL:[57,90],rK:[35,128],rA:[28,168],lK:[65,128],lA:[72,168],dR:-1,dL:1};
const stC={hR:[44,89],hL:[56,89],rK:[42,128],rA:[40.5,168],lK:[58,128],lA:[59.5,168],dR:-1,dL:1};
const sections=[
 {name:"HANDS DOWN",frames:[
  {cap:"HANDS ON HEAD",hd:[50,14],ht:-3,sR:[37.5,37],sL:[62.5,35.5],rE:[15,26],rH:[38,10],lE:[85,25],lH:[62,9],...stA,front:1,
   A:["M8 68Q-8 40 13 17","M92 68Q108 40 87 17"]},
  {cap:"HANDS ON SHOULDERS",hd:[50,15],ht:2,sR:[37,38],sL:[62.5,36],rE:[21,57],rH:[35.5,35],lE:[79,55],lH:[64.5,33],...stB,
   A:["M20 8Q4 22 17 37","M80 6Q96 20 83 35"]},
  {cap:"HANDS ON HIPS",hd:[50,15],ht:-2,sR:[37.5,36.5],sL:[62.5,36.5],rE:[26,58],rH:[41,80],lE:[74,58],lH:[59,80],...stW,
   A:["M10 40Q-2 64 27 80","M90 40Q102 64 73 80"]}]},
 {name:"TAP & SLIDE",frames:[
  {cap:"CHEST TAP",hd:[50,15],ht:3,sR:[37.5,36.5],sL:[62.5,35.5],rE:[28,63],rH:[45,53],lE:[72,62],lH:[55,52],...stA,
   A:["M14 82Q8 58 32 55","M86 82Q92 58 68 54"]},
  {cap:"ARM OUT, SLIDE TO SHOULDER",hd:[48,16],ht:-6,sR:[37,36],sL:[62,38],rE:[11,37],rH:[-15,35],lE:[40,54],lH:[17,40],...stB,hR:[43,91],hL:[58.5,87.5],
   A:["M30 22L-10 24","M58 78Q26 80 19 50","M24 46Q34 40 38 34"]}]},
 {name:"REACH & CLAP",frames:[
  {cap:"REACH OUT, TAP HEART",hd:[50,15],ht:2,sR:[37,36],sL:[62.5,36],rE:[11,37],rH:[-15,35],lE:[74,58],lH:[56,51],...stB,
   A:["M106 40Q98 70 62 58"]},
  {cap:"CLAP IN THE CENTER",hd:[50,15],ht:0,sR:[37.5,36.5],sL:[62.5,36.5],rE:[27,54],rH:[47,42],lE:[73,54],lH:[53,42],...stC,
   A:["M8 30Q10 44 38 44","M92 30Q90 44 62 44"]}]}
];
let gn=0; // moves are numbered 1-7 straight through the poster
const secs=document.getElementById("secs");
sections.forEach((sec,si)=>{
  const top=430+si*770;
  let frames="";
  sec.frames.forEach((fr,i)=>{
    const arrows=(fr.A||[]).map(d=>`<path d="${d}" fill="none" stroke="${C.navy}" stroke-width="1.7" stroke-dasharray=".2 3.3" stroke-linecap="round" marker-end="url(#ar)"/>`).join("");
    const k=++gn;
    frames+=`<div class="frame"><div class="num">${k}</div>
      <svg viewBox="-18 -2 136 184" preserveAspectRatio="xMidYMax meet">${figure(fr)}${arrows}</svg>
      <img class="photo" src="figures/move${k}.png" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()">
      <div class="cap">${fr.cap}</div></div>`;
  });
  secs.insertAdjacentHTML("beforeend",
    `<div class="sec" style="top:${top}px"><div class="row">${frames}</div><div class="name">${sec.name}</div></div>
     <div class="rule" style="top:${top+742}px"></div>`);
});
</script></body></html>
