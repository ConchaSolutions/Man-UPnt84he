<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Dance It Out Infographic</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face{font-family:"Marker";src:url("fonts/Permanent_Marker.ttf")}
  @font-face{font-family:"Hand";src:url("fonts/Patrick_Hand.ttf")}
  @font-face{font-family:"Brush";src:url("fonts/Caveat_Brush.ttf")}
  :root{--ink:#1d1d22;--red:#e63946;--blue:#2f6fdb;--green:#2e9e4f;--orange:#f08a00;--purple:#7a4fc9;--pink:#e84a9a;--teal:#14a3b8;--yellow:#f2c200;}
  html,body{margin:0;background:#fff;}
  #art{width:1500px;height:1800px;position:relative;overflow:hidden;color:var(--ink);background:#fff}
  .paper{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0) 55%,rgba(120,100,60,.10) 100%);}
  .paper svg{position:absolute;inset:0;width:100%;height:100%;opacity:.5;mix-blend-mode:multiply}
  .wob{filter:url(#wob)} .wob2{filter:url(#wob2)}
  h1{margin:0;text-align:center;font:400 168px/0.95 "Marker",cursive;padding-top:44px;transform:rotate(-3deg);letter-spacing:2px}
  h1 .r{color:var(--red)} h1 .b{color:var(--blue)}
  .under{display:block;margin:-6px auto 0;width:1100px;height:60px}
  .sub{text-align:center;font:400 70px "Brush",cursive;margin-top:6px;letter-spacing:2px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:44px 34px;padding:50px 56px 0;position:relative}
  .card{border:6px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;position:relative;height:480px;transform:rotate(var(--r));
        background:rgba(255,255,255,.0)}
  .card .tape{position:absolute;top:-22px;right:34px;width:90px;height:34px;background:var(--c);opacity:.55;transform:rotate(7deg)}
  .num{position:absolute;top:-38px;left:-26px;width:84px;height:84px;border-radius:50%;background:var(--c);border:6px solid var(--ink);
       font:400 52px/76px "Marker",cursive;text-align:center;color:#fff;z-index:2}
  .card svg{position:absolute;left:0;top:20px;width:100%;height:335px;overflow:visible}
  .name{position:absolute;bottom:80px;width:100%;text-align:center;font:400 38px "Marker",cursive;color:var(--c);white-space:nowrap;
        -webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill}
  .cnt{position:absolute;bottom:30px;width:100%;text-align:center;font:400 30px "Hand",cursive;color:var(--ink);white-space:nowrap}
  .beat{display:flex;justify-content:center;gap:26px;margin-top:44px}
  .beat i{width:56px;height:56px;border-radius:50%;display:block;border:5px solid var(--ink)}
  .foot{text-align:center;margin-top:14px;font:400 104px "Brush",cursive;letter-spacing:3px;transform:rotate(-1.5deg)}
  .foot span{color:var(--red)} .foot b{color:var(--blue);font-weight:400} .foot u{color:var(--green);text-decoration:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="wob2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .4  0 0 0 .22 0"/></filter>
</svg>
<div id="art">
  <div class="paper"><svg><rect width="100%" height="100%" filter="url(#grain)"/></svg></div>
  <h1 class="wob2"><span class="r">DANCE</span> IT <span class="b">OUT</span></h1>
  <svg class="under wob" viewBox="0 0 1100 60"><path d="M10 38 C120 8 200 58 320 30 S520 8 640 36 S860 56 1090 20" fill="none" stroke="#f2c200" stroke-width="16" stroke-linecap="round" opacity=".9"/>
    <path d="M30 48 C160 28 260 62 400 42 S700 30 840 46 S1000 40 1080 34" fill="none" stroke="#1d1d22" stroke-width="4" stroke-linecap="round"/></svg>
  <div class="sub wob2">7 steps &bull; 1 beat &bull; no rules!</div>
  <div class="grid wob" id="grid"></div>
  <div class="beat wob" id="beat"></div>
  <div class="foot wob2"><span>repeat.</span> <b>smile.</b> <u>glow.</u> &#9825;</div>
</div>
<script>
// Poses reconstructed from frames of a tutorial screen recording (about 3.7s, 8 fps).
// joints on a 100x140 canvas: [x,y]
const INK="#1d1d22";
const base={neck:[50,32],hip:[50,80]};
const col=["#e63946","#2f6fdb","#2e9e4f","#f08a00","#7a4fc9","#e84a9a","#14a3b8","#f2c200"];
const poses=[
 {n:"SPARKLE",r:"-1.5deg",cnt:"wiggle fingers by your head",
  lE:[27,36],lH:[20,8],rE:[73,36],rH:[80,8],lK:[42,106],lF:[38,134],rK:[58,106],rF:[62,134],fx:"spark"},
 {n:"SHIMMY",r:"1.2deg",cnt:"hands drop, flutter",
  lE:[22,52],lH:[33,40],rE:[78,52],rH:[67,40],lK:[42,106],lF:[38,134],rK:[58,106],rF:[62,134],fx:"shimmy"},
 {n:"SWING OUT",r:"-1deg",cnt:"arms sweep down and out",
  lE:[26,58],lH:[6,80],rE:[74,58],rH:[94,80],lK:[40,106],lF:[34,134],rK:[60,106],rF:[66,134],fx:"swish"},
 {n:"HIP BOUNCE",r:"1.8deg",cnt:"hands low, knees bounce",
  lE:[24,60],lH:[38,82],rE:[76,60],rH:[62,82],lK:[32,104],lF:[26,134],rK:[68,104],rF:[74,134],fx:"bounce"},
 {n:"CHEST TAP",r:"-1.8deg",cnt:"pat your heart on the beat",
  lE:[30,58],lH:[45,46],rE:[70,58],rH:[55,46],lK:[43,106],lF:[40,134],rK:[57,106],rF:[60,134],fx:"tap"},
 {n:"REACH & TAP",r:"1deg",cnt:"one arm out, one hand taps",
  lE:[26,40],lH:[3,30],rE:[68,60],rH:[54,47],lK:[40,106],lF:[32,134],rK:[58,106],rF:[64,134],fx:"reach"},
 {n:"BLESS & CLAP",r:"-1.2deg",cnt:"hands up high, then clap!",
  lE:[34,54],lH:[48,32],rE:[66,54],rH:[52,32],lK:[42,106],lF:[38,134],rK:[58,106],rF:[62,134],fx:"burst"}
];
const L=(a,b,w,c)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const star=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 -7l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="${c}" stroke="${INK}" stroke-width="1"/>`;
function fx(p,c){
  const T=p.fx,S=`stroke="${c}" stroke-width="3.2" fill="none" stroke-linecap="round"`;
  if(T==="spark")return star(14,2,1.2,"#f2c200")+star(86,2,1.2,"#f2c200")+star(8,24,.8,c)+star(92,24,.8,c);
  if(T==="shimmy")return `<path d="M20 36q-6 4 0 8M14 34q-9 7 0 14M80 36q6 4 0 8M86 34q9 7 0 14" ${S}/>`;
  if(T==="swish")return `<path d="M20 52q-14 6-16 22M80 52q14 6 16 22" ${S} stroke-dasharray="3 5"/>`;
  if(T==="bounce")return `<path d="M50 110v10m-6-5l6 7 6-7" ${S}/>`;
  if(T==="tap")return `<path d="M38 40l-5-5M62 40l5-5M50 36v-6" ${S}/>`;
  if(T==="reach")return `<path d="M-4 44q4-6 0-12M-8 48q8-10 0-20" ${S}/><path d="M44 40l-4-4M60 42l4-4" ${S}/>`;
  if(T==="burst")return `<path d="M50 20v-10M36 24l-7-7M64 24l7-7M30 34l-10-2M70 34l10-2" ${S}/>`;
  return "";
}
function figure(p,c){
  const sh=[50,38];
  // marker-coloured shirt, slightly off the lines like real colouring
  const shirt=`<path d="M40 40 L60 40 L58 72 L43 72 Z" fill="${c}" opacity=".75" transform="translate(2 1)"/>`;
  const pants=`<path d="M43 76 L58 76 L${p.rK[0]+3} ${p.rK[1]} L${p.rF[0]+3} ${p.rF[1]-4} L${p.lF[0]-1} ${p.lF[1]-4} L${p.lK[0]-1} ${p.lK[1]} Z" fill="${c}" opacity=".28"/>`;
  const body=L(base.neck,base.hip,4.6,INK)+
    L(sh,p.lE,4.6,INK)+L(p.lE,p.lH,4.6,INK)+L(sh,p.rE,4.6,INK)+L(p.rE,p.rH,4.6,INK)+
    L(base.hip,p.lK,4.8,INK)+L(p.lK,p.lF,4.8,INK)+L(base.hip,p.rK,4.8,INK)+L(p.rK,p.rF,4.8,INK);
  const hands=[p.lH,p.rH].map(h=>`<circle cx="${h[0]}" cy="${h[1]}" r="4.2" fill="${c}" stroke="${INK}" stroke-width="2.2"/>`).join("");
  const shoes=[p.lF,p.rF].map(f=>`<ellipse cx="${f[0]}" cy="${f[1]+2}" rx="7" ry="3.6" fill="${c}" stroke="${INK}" stroke-width="2.2"/>`).join("");
  const head=`<circle cx="50" cy="18" r="13" fill="#fff" stroke="${INK}" stroke-width="3.6"/>
    <path d="M37 16 Q40 3 52 5 Q63 6 63 17 Q55 9 46 11 Q40 12 37 16Z" fill="${INK}"/>
    <circle cx="45.5" cy="19" r="1.6" fill="${INK}"/><circle cx="55" cy="19" r="1.6" fill="${INK}"/>
    <path d="M44 24 Q50 30 57 24" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="41" cy="24" r="2.6" fill="${c}" opacity=".5"/><circle cx="60" cy="24" r="2.6" fill="${c}" opacity=".5"/>`;
  return pants+shirt+body+hands+shoes+head;
}
const grid=document.getElementById("grid");
poses.forEach((p,i)=>{
  const c=col[i];
  grid.insertAdjacentHTML("beforeend",
   `<div class="card" style="--c:${c};--r:${p.r}"><div class="tape"></div><div class="num">${i+1}</div>
    <svg viewBox="-14 -14 128 160"><ellipse cx="50" cy="72" rx="56" ry="66" fill="${c}" opacity=".13"/>${fx(p,c)}${figure(p,c)}</svg>
    <div class="name" style="--c:${c}">${p.n}</div><div class="cnt">${p.cnt}</div></div>`);
});
// card 8: loop
const c8=col[7];
grid.insertAdjacentHTML("beforeend",
 `<div class="card" style="--c:${c8};--r:1.6deg"><div class="tape"></div><div class="num" style="color:#1d1d22">8</div>
  <svg viewBox="0 0 100 130"><ellipse cx="50" cy="66" rx="48" ry="56" fill="${c8}" opacity=".2"/>
   <g fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"><path d="M20 60a32 32 0 0 1 56-20"/><path d="M80 70a32 32 0 0 1-56 20"/></g>
   <path d="M84 20l1 26-24-9z" fill="${c8}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M16 110l-1-26 24 9z" fill="${c8}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
   <path d="M50 50l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="${col[0]}" stroke="${INK}" stroke-width="2"/></svg>
  <div class="name" style="--c:${c8}">LOOP IT</div><div class="cnt">back to step 1!</div></div>`);
const beat=document.getElementById("beat");
for(let i=0;i<8;i++)beat.insertAdjacentHTML("beforeend",`<i style="background:${col[i%8]};transform:scale(${i%2?.8:1})"></i>`);
</script></body></html>
